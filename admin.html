<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>管理後台｜動物本色</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="brand/tokens.css">
<script>try{const t=localStorage.getItem('disc-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-round);font-weight:400;line-height:1.3;margin:0}
h3{font-size:18px}
h1{font-size:26px}
h2{font-size:21px;overflow-wrap:anywhere}
p{margin:0}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

.site-bar{background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:800px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;font-family:var(--font-round);font-size:18px}
.bar-in img{width:28px;height:28px}
.bar-in .sp{flex:1}
main{max-width:800px;margin:0 auto;padding:20px 16px 64px;display:grid;gap:16px}
main>*{min-width:0}

.btn{min-height:44px;padding:8px 16px;border:1px solid var(--ink);border-radius:var(--radius-ctrl);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;font-weight:500;line-height:1.35;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.quiet{border-color:var(--line);font-weight:400}
.btn[aria-expanded="true"]{background:var(--selected)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .btn{flex:1 1 auto;font-weight:400}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:16px;display:grid;gap:12px;min-width:0}
.card>*{min-width:0}
.login{max-width:440px;margin:48px auto 0;text-align:center;justify-items:center;padding:28px 20px}
.login img{width:56px;height:56px}
.head-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.head-row h2{margin-right:2px}
.badge{display:inline-block;padding:1px 10px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
.badge.open{background:var(--btn);color:var(--btn-ink)}
.badge.closed{background:var(--sunk);color:var(--ink)}
.badge.future{border:1px solid var(--ink)}
.badge.test{background:var(--warn-bg);color:var(--warn-ink)}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-ctrl);padding:10px 8px;text-align:center}
.card .tile{background:var(--bg);border-color:transparent}
.tile b{display:block;font-size:26px;line-height:1.25;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:14px;line-height:1.4}
.rows{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin:0;font-size:16px}
.rows dt{font-weight:500}
.rows dd{margin:0;overflow-wrap:anywhere}
.rows dd.pre{white-space:pre-wrap}

.panel{background:var(--bg);border-radius:var(--radius-ctrl);padding:14px;display:grid;gap:12px}
.panel>*{min-width:0}
.field{display:grid;gap:4px;min-width:0}
.field label,.label{font-weight:500;font-size:16px}
.input{width:100%;min-width:0;min-height:44px;padding:8px 12px;border:1px solid var(--faint);border-radius:var(--radius-ctrl);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.input[aria-invalid="true"]{border-color:var(--err)}
textarea.input{resize:vertical;line-height:1.6}
.hint{font-size:15px}
.field-err{color:var(--err);font-size:15px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--radius-ctrl);padding:10px 12px;font-size:16px}
.ok{font-weight:500;font-size:16px;overflow-wrap:anywhere}
.err{color:var(--err);font-size:16px;overflow-wrap:anywhere}
.linkbox{display:grid;gap:6px}
.linkbox code{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-ctrl);padding:8px 12px;font-size:15px;line-height:1.5;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.qr{display:grid;justify-items:center;gap:8px}
.qr img{width:240px;height:240px;max-width:100%;border-radius:8px;display:block}
.empty{text-align:center;padding:28px 16px;justify-items:center}
.note{font-size:15px}
@media (min-width:640px){
  .login{margin-top:80px}
  .tile b{font-size:30px}
}
</style>
</head>
<body>
<div id="root"><p role="status">正在載入…</p></div>
<noscript><p>這個頁面需要開啟 JavaScript。</p></noscript>
<script src="js/config.js"></script>
<script src="js/admin-export.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
