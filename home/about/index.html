<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>關於｜尋光引路實驗室</title>
<meta name="description" content="尋光引路實驗室（lumineer.lab）：有一些陪伴探索的小工具。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--ink:#ece4d2;--warm:#ffd88f;--bg:#04060a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% 0%,#0d1624 0%,var(--bg) 60%) fixed;color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:2;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{padding:22px max(24px,env(safe-area-inset-left,0px));opacity:.75;letter-spacing:.2em;font-size:14px;line-height:1.7}
header b{display:block;font-weight:500;font-size:16px;letter-spacing:.3em}
main{flex:1;width:100%;max-width:34em;margin:0 auto;padding:8vh 24px 48px}
p{margin:0 0 2.2em;font-size:clamp(14px,4.4vw,19px);letter-spacing:.08em}
p span{display:block;white-space:nowrap}
p:first-child{color:var(--warm)}
main p:last-child{margin-bottom:0}
nav{padding:0 24px 32px;text-align:center;font-size:14px;letter-spacing:.15em}
nav a{display:inline-block;min-height:44px;line-height:44px;padding:0 12px;color:var(--ink);opacity:.6;text-decoration:none}
nav a:hover,nav a:focus-visible{opacity:1;outline:none;text-decoration:underline;text-underline-offset:6px}
.tool{color:var(--warm)}
</style>
</head>
<body>
<header><b>尋光引路實驗室</b>lumineer.lab</header>
<main>
<p><span>迷茫，是人之常情。</span><span>出發，路就在腳下。</span></p>
<p><span>每一步的行動，</span><span>是勇氣、是希望；</span><span>是光芒，是引導；</span><span>也是未來道路的起點。</span></p>
<p><span>這裡是尋光引路實驗室，</span><span>有一些陪伴探索的小工具。</span><span>希望有機會陪著你，</span><span>點亮下一道光，實踐下一哩路。</span></p>
<p><span>不必有完美方法，</span><span>也不需要有標準答案，</span><span>只要先開始，踏出一小步就好。</span></p>
</main>
<nav><a href="/">回首頁</a> <a class="tool" href="/animal-colors-disc/">找尋你的動物本色</a></nav>
</body>
</html>
