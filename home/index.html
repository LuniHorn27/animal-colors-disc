<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Lumineer Lab</title>
<meta name="description" content="Lumineer Lab：職涯探索小工具。網站建置中，目前可以先玩「測出你的動物本色」。">
<!-- lumineerlab.com 的首頁（建置中）。建置時由 build.sh 複製到網站最上層 -->
<script>/* 舊網址 animal-colors-disc.pages.dev 自動轉到新網址，保留路徑與 ?c= 等參數。
   舊網址的任何路徑（/、/peer.html、/t…）都會打開這一頁，所以在這裡統一轉。預覽網址（xxx.animal-colors-disc.pages.dev）不轉，方便測試 */
if(location.hostname==='animal-colors-disc.pages.dev'){var p=location.pathname;if(p.indexOf('/animal-colors-disc/')!==0)p='/animal-colors-disc'+p;location.replace('https://lumineerlab.com'+p+location.search+location.hash);}</script>
<link rel="icon" href="/animal-colors-disc/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --ink:#1F2329; --muted:#5B6068; --line:#D7DADF;
  --btn:#1F2329; --btn-ink:#FFFFFF;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F0F0F; --surface:#1C1C1C; --ink:#F2F2F2; --muted:#B3B3B3; --line:#333333;
  --btn:#F2F2F2; --btn-ink:#0F0F0F; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.7;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:72px 16px 48px}
.status{display:inline-block;margin:0 0 20px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;
  font-size:14px;font-weight:500;color:var(--muted)}
h1{margin:0 0 16px;font-size:clamp(36px,9vw,52px);line-height:1.15;font-weight:700;letter-spacing:.01em}
.intro{margin:0 0 48px;font-size:17px;color:var(--muted);max-width:32em}
h2{margin:0 0 12px;font-size:15px;font-weight:500;color:var(--muted)}
.tool{display:flex;align-items:center;gap:16px;padding:20px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;color:inherit;text-decoration:none;transition:border-color .15s ease}
.tool:hover{border-color:var(--muted)}
.tool:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.tool img{width:48px;height:48px;flex:none}
.tool-text{flex:1;min-width:0}
.tool-name{display:block;font-size:18px;font-weight:700}
.tool-desc{display:block;font-size:15px;color:var(--muted)}
.tool-go{flex:none;padding:8px 14px;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-size:15px;font-weight:500;white-space:nowrap}
footer{padding:24px 16px;text-align:center;font-size:13px;color:var(--muted)}
@media (max-width:420px){
  main{padding-top:48px}
  .tool{flex-wrap:wrap}
  .tool-go{width:100%;text-align:center}
}
@media (prefers-reduced-motion:reduce){.tool{transition:none}}
</style>
</head>
<body>
<main>
  <p class="status">網站建置中</p>
  <h1>Lumineer Lab</h1>
  <!-- 介紹文字：之後換成自己的起心動念與網站未來要做的事 -->
  <p class="intro">這裡會陸續放上職涯探索的小工具。介紹文字整理中，先從第一個工具開始吧。</p>

  <h2>目前可以用的工具</h2>
  <a class="tool" href="/animal-colors-disc/">
    <img src="/animal-colors-disc/brand/logo-mark.svg" alt="">
    <span class="tool-text">
      <span class="tool-name">測出你的動物本色</span>
      <span class="tool-desc">DISC 行為風格測驗，用四種動物看懂你的做事風格</span>
    </span>
    <span class="tool-go">開始測驗</span>
  </a>
</main>
<footer>© 2026 Lumineer Lab</footer>
</body>
</html>
