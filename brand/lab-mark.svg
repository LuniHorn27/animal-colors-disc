<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath>
    <!-- 車頭燈照亮的範圍：越遠越暗 -->
    <linearGradient id="cone" gradientUnits="userSpaceOnUse" x1="37" y1="0" x2="64" y2="0">
      <stop offset="0" stop-color="#e9f3d8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#e9f3d8" stop-opacity="0"/>
    </linearGradient>
    <!-- 松樹被照到的地方才看得見 -->
    <linearGradient id="pine" gradientUnits="userSpaceOnUse" x1="36" y1="0" x2="64" y2="0">
      <stop offset="0" stop-color="#4c8a72"/>
      <stop offset="1" stop-color="#16271f"/>
    </linearGradient>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="29" cy="36" r="26">
      <stop offset="0" stop-color="#b9c9b4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#b9c9b4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#04070b"/>
  <g clip-path="url(#r)">
    <!-- 星星 -->
    <g fill="#dfe8ff" opacity=".7"><circle cx="10" cy="8" r=".9"/><circle cx="30" cy="5" r=".8"/><circle cx="52" cy="9" r=".9"/></g>
    <!-- 松樹 -->
    <g fill="url(#pine)">
      <path d="M44 50l6-20 6 20z"/><path d="M47 38l3-18 3 18z" transform="translate(0 -4)"/>
      <path d="M54 52l5-17 5 17z"/><path d="M38 51l4-12 4 12z"/>
    </g>
    <!-- 車燈光束與周圍微光 -->
    <polygon points="36.5,32.5 64,18 64,50" fill="url(#cone)"/>
    <circle cx="29" cy="36" r="26" fill="url(#halo)"/>
    <!-- 山徑 -->
    <path d="M-2 57Q24 53 40 54T66 49" stroke="#b49d72" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <!-- 騎士（形狀取自首頁 rider.js） -->
    <g transform="translate(24 56) scale(.36)" fill="#04070b" stroke="#04070b" stroke-linecap="round" stroke-linejoin="round">
      <g fill="none"><circle cx="-31" cy="-21" r="21" stroke-width="4.5"/><circle cx="31" cy="-21" r="21" stroke-width="4.5"/>
        <path stroke-width="5" d="M-31 -21L0 -24L-13 -56L-31 -21M0 -24L24 -54L-13 -56M24 -54L31 -21M24 -54L21 -65L31 -67M-19 -58L-7 -58"/>
        <path stroke-width="8" d="M-13 -62L5.6 -42.4L6.8 -15.4M-13 -62L12 -52L-6.8 -32.6" opacity=".95"/>
        <path stroke-width="12" d="M-13 -62L8 -90"/>
        <path stroke-width="7" d="M8 -88L7 -66L29 -67"/></g>
      <circle cx="15" cy="-102" r="8.5" stroke="none"/><rect x="-14" y="-96" width="14" height="26" rx="5" stroke="none"/>
    </g>
    <!-- 車頭燈 -->
    <circle cx="36.3" cy="32.6" r="3.6" fill="#fff6d8" opacity=".45"/><circle cx="36.3" cy="32.6" r="1.7" fill="#fff6d8"/>
  </g>
</svg>
