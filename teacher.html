<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>班級統計｜測出你的動物本色</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="brand/tokens.css">
<script>try{const t=localStorage.getItem('disc-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--font-round);font-weight:400;line-height:1.3;margin:0}
.site-bar{background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:800px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;font-family:var(--font-round);font-size:18px}
.bar-in img{width:28px;height:28px}
main{max-width:800px;margin:0 auto;padding:32px 16px 64px;display:flex;flex-direction:column;gap:40px}
.head h1{font-size:clamp(28px,5vw,40px)}
.status{margin:8px 0 0;color:var(--muted);font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live{width:9px;height:9px;border-radius:50%;background:var(--s);flex:none}
.status.off .live{background:var(--faint)}
.status.err .live{background:var(--d)}
.count{font-size:20px;color:var(--ink);margin:16px 0 0}
.count b{font-size:clamp(34px,6vw,48px);font-weight:700;font-variant-numeric:tabular-nums;margin-right:4px}
.count-note{margin:4px 0 0;color:var(--muted);font-size:15px}
section h2{font-size:24px;margin-bottom:6px}
.sub{color:var(--muted);font-size:15px;margin:0 0 18px}

/* 男女比例：一條分段長條，下面是圖例 */
.split{display:flex;height:40px;border-radius:10px;overflow:hidden;gap:2px;background:var(--sunk)}
.split span{display:flex;align-items:center;padding:0 12px;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;min-width:0;transition:flex-grow .4s ease}
.split .m{background:#5B7FA6;color:#fff}
.split .f{background:#B5728E;color:#fff}
.split .u{background:var(--sunk);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin:10px 0 0;padding:0;list-style:none;font-size:15px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.legend b{color:var(--ink);font-weight:500}

/* 主要動物：花紋長條，全頁唯一的重點 */
.animals{display:flex;flex-direction:column;gap:14px}
.arow{display:grid;grid-template-columns:118px 1fr 76px;align-items:center;gap:14px}
.aname{font-family:var(--font-round);font-size:22px;line-height:1.2;white-space:nowrap}
.aname small{display:block;font-family:var(--font-sans);font-size:13px;color:var(--muted)}
.atrack{height:44px;background:var(--sunk);border-radius:10px;overflow:hidden}
.atrack svg{display:block;width:100%;height:100%}
.anum{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;line-height:1.1}
.anum small{display:block;font-size:14px;font-weight:400;color:var(--muted)}

/* 完整類型：安靜的中性長條，分成四組 */
.labels{display:grid;grid-template-columns:max-content minmax(60px,1fr) max-content;align-items:center;column-gap:14px;row-gap:10px;font-size:16px}
.lrow{display:contents}
.lname{display:flex;align-items:center;gap:8px;min-width:0}
.chips{display:inline-flex;gap:3px;flex:none}
.chips i{width:10px;height:10px;border-radius:50%}
.ltrack{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.ltrack i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .4s ease}
.lnum{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lnum small{color:var(--muted);font-size:13px;margin-left:6px}
.lgroup{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;padding-bottom:5px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.lgroup:first-child{margin-top:0}
.lgroup b{color:var(--ink);font-weight:500;font-size:15px}

/* 分數分布：每位學生一個點 */
.dist svg{display:block;width:100%;height:auto;overflow:visible}
.dist text{font-family:var(--font-sans);fill:var(--muted);font-size:13px}
.dist .tname{font-family:var(--font-round);fill:var(--ink);font-size:17px}
.notes{margin:16px 0 0;padding-left:1.2em;color:var(--muted);font-size:15px}
.notes li+li{margin-top:4px}

.empty,.msg{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:24px;font-size:17px}
.msg{background:var(--warn-bg);color:var(--warn-ink);border:0}
.foot{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:16px}
[hidden]{display:none!important}
@media (max-width:560px){
  .arow{grid-template-columns:92px 1fr 60px;gap:10px}
  .aname{font-size:18px}
  .atrack{height:36px}
  .anum{font-size:22px}
  .labels{font-size:15px;column-gap:10px}
}
@media (prefers-reduced-motion:reduce){.ltrack i,.split span{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="pat-defs"></defs></svg>
<header class="site-bar"><div class="bar-in"><img src="brand/logo-mark.svg" alt="">測出你的動物本色</div></header>

<main>
  <div class="head">
    <h1 id="title">班級統計</h1>
    <p class="status" id="status" role="status"><span class="live" aria-hidden="true"></span><span id="status-text">讀取中</span></p>
    <p class="count" id="count" hidden><b id="count-n">0</b>人完成作答</p>
    <p class="count-note" id="count-note" hidden></p>
  </div>

  <div class="msg" id="msg" hidden></div>
  <div class="empty" id="empty" hidden>還沒有人完成作答。學生送出後，這裡每 10 秒會自動更新。</div>

  <section id="sec-gender" hidden aria-labelledby="h-gender">
    <h2 id="h-gender">男女比例</h2>
    <p class="sub">依作答時選填的性別。</p>
    <div class="split" id="split" aria-hidden="true"></div>
    <ul class="legend" id="legend"></ul>
  </section>

  <section id="sec-animals" hidden aria-labelledby="h-animals">
    <h2 id="h-animals">主要動物</h2>
    <p class="sub">每人只算一種：組合型算分數較高的那種，四種差不多的算變色龍。</p>
    <div class="animals" id="animals"></div>
  </section>

  <section id="sec-labels" hidden aria-labelledby="h-labels">
    <h2 id="h-labels">完整類型</h2>
    <p class="sub">和學生結果頁上的 11 種類型相同。</p>
    <div class="labels" id="labels"></div>
  </section>

  <section id="sec-dist" class="dist" hidden aria-labelledby="h-dist">
    <h2 id="h-dist">分數分布</h2>
    <p class="sub">一個點是一位學生，不顯示名字。</p>
    <div id="dist"></div>
    <ul class="notes">
      <li>分數代表行為上的偏好，不是能力高低，不適合拿來比較或排名。</li>
      <li>點越集中，代表全班在這種動物上越接近；點越分散，代表班上差異越大。</li>
    </ul>
  </section>

  <p class="foot" id="foot" hidden></p>
</main>

<script src="js/config.js"></script>
<script>
'use strict';
const CFG = window.DISC_CONFIG || {};
const TYPES = ['D','I','S','C'];
const ANIMAL = {D:'老虎', I:'孔雀', S:'無尾熊', C:'貓頭鷹', CH:'變色龍'};
const TNAME = {D:'支配', I:'影響', S:'穩定', C:'分析'};
const COLOR = {D:'var(--d)', I:'var(--i)', S:'var(--s)', C:'var(--c)', CH:'var(--x)'};
const LABELS = [['D'],['I'],['S'],['C'],['CH'],['DI','D','I'],['IS','I','S'],['SC','S','C'],['CD','C','D'],['DS','D','S'],['IC','I','C']];
/* 完整類型的四組：在第幾個類型之前放小標題 */
const GROUPS = {0:['單一型','一種動物特別明顯'], 4:['變色龍','四種差不多'], 5:['組合型','相鄰兩種差不多明顯'], 9:['對角型','方向相反的兩種都明顯']};
const REFRESH_MS = 10000;
const LBL = k => k === 'CH' ? '變色龍' : `${k} ${ANIMAL[k]}`;
const $ = s => document.querySelector(s);

/* 動物花紋（與首頁、結果頁同一份圖案） */
const PAT = {
  D:{w:44,h:44,rot:-32,scale:.9,base:'#D66A14',els:[['path','M0 9C11 3 24 15 44 7L44 14C25 22 11 10 0 15Z','#3A1C07'],['path','M0 31C13 26 27 37 44 30L44 35C27 43 13 32 0 37Z','#3A1C07']]},
  I:{w:40,h:40,base:'#11968A',els:[['ell',10,11,8,10,0,'#0B4F66'],['ell',10,12,5,6.4,0,'#F3C24F'],['ell',10,13,2.8,2.8,0,'#142A4C'],['ell',30,31,8,10,0,'#0B4F66'],['ell',30,32,5,6.4,0,'#F3C24F'],['ell',30,33,2.8,2.8,0,'#142A4C']]},
  S:{w:36,h:36,base:'#5E9A47',els:[['ell',9,10,3.6,8.5,38,'#3C6B30'],['ell',27,27,3.6,8.5,-38,'#3C6B30'],['ell',27,8,2.2,2.2,0,'#DCEBD3'],['ell',9,28,2.2,2.2,0,'#DCEBD3']]},
  C:{w:20,h:16,base:'#6576DC',els:[['line','M0 16A10 10 0 0 1 20 16M-10 8A10 10 0 0 1 10 8M10 8A10 10 0 0 1 30 8','#222A6E',2]]}
};
$('#pat-defs').innerHTML = TYPES.map(t=>{
  const p = PAT[t];
  const els = p.els.map(e => e[0]==='path' ? `<path d="${e[1]}" fill="${e[2]}"/>`
    : e[0]==='ell' ? `<ellipse cx="${e[1]}" cy="${e[2]}" rx="${e[3]}" ry="${e[4]}" transform="rotate(${e[5]} ${e[1]} ${e[2]})" fill="${e[6]}"/>`
    : `<path d="${e[1]}" fill="none" stroke="${e[2]}" stroke-width="${e[3]}"/>`).join('');
  const tf = p.rot ? ` patternTransform="rotate(${p.rot}) scale(${p.scale})"` : '';
  return `<pattern id="pat-${t}" width="${p.w}" height="${p.h}" patternUnits="userSpaceOnUse"${tf}><rect width="${p.w}" height="${p.h}" fill="${p.base}"/>${els}</pattern>`;
}).join('');

/* 秘密連結放在網址 # 後面（不會送到伺服器的紀錄裡） */
const TOKEN = (new URLSearchParams(location.hash.slice(1)).get('k') || '').trim();

const fmtN = n => String(n || 0);
/* 百分比：用最大餘數法取整數，盡量讓加總剛好 100%。
   人數相同的項目一定顯示相同的百分比；遇到同分搶最後幾個 1% 時寧可加總差 1–2%，也不讓同樣人數顯示不同百分比 */
function pct(counts){
  const total = counts.reduce((a, b) => a + b, 0);
  if (!total) return counts.map(() => 0);
  const raw = counts.map(n => n / total * 100), out = raw.map(Math.floor);
  let left = 100 - out.reduce((a, b) => a + b, 0);
  const groups = {};
  counts.forEach((n, i) => { if (n > 0 && raw[i] > out[i]) (groups[n] = groups[n] || []).push(i); });
  Object.values(groups).sort((a, b) => (raw[b[0]] - out[b[0]]) - (raw[a[0]] - out[a[0]])).forEach(g => {
    if (g.length <= left){ g.forEach(i => out[i]++); left -= g.length; }
  });
  return out;
}

function renderGender(g){
  const parts = [['m','生理男', g['生理男'] || 0], ['f','生理女', g['生理女'] || 0], ['u','未填', g[''] || 0]];
  const ps = pct(parts.map(p => p[2]));
  $('#split').innerHTML = parts.map(([c, name, n], i) => n ? `<span class="${c}" style="flex-grow:${n}">${c === 'u' ? n : name + ' ' + n}</span>` : '').join('');
  $('#legend').innerHTML = parts.filter(p => p[0] !== 'u' || p[2]).map(([c, name, n]) =>
    `<li><i class="${c}" style="background:${c==='m'?'#5B7FA6':c==='f'?'#B5728E':'var(--sunk)'}"></i>${name} <b>${n}</b> 人（${ps[parts.findIndex(p => p[0] === c)]}%）</li>`).join('');
}

const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderAnimals(a){
  const keys = ['D','I','S','C','CH'];
  const ns = keys.map(k => a[k] || 0), ps = pct(ns);
  $('#animals').innerHTML = keys.map((k, i)=>{
    const n = ns[i], w = ps[i];
    const fill = k === 'CH' ? 'var(--x)' : `url(#pat-${k})`;
    const sub = k === 'CH' ? '四型均衡' : `${TNAME[k]}型`;
    return `<div class="arow" role="img" aria-label="${LBL(k)} ${w}%，${n} 人">
      <span class="aname" aria-hidden="true">${LBL(k)}<small>${sub}</small></span>
      <span class="atrack" aria-hidden="true"><svg preserveAspectRatio="none"><rect width="${w}%" height="100%" fill="${fill}" rx="10"/></svg></span>
      <span class="anum" aria-hidden="true">${w}%<small>${n} 人</small></span></div>`;
  }).join('');
}

function renderLabels(l){
  const ns = LABELS.map(([k]) => l[k] || 0), ps = pct(ns);
  $('#labels').innerHTML = LABELS.map(([k, ...parts], i)=>{
    const n = ns[i];
    const name = parts.length ? parts.map(LBL).join('＋') : LBL(k);
    const chips = (k === 'CH' ? ['CH'] : parts.length ? parts : [k]).map(t=>`<i style="background:${COLOR[t]}"></i>`).join('');
    const head = GROUPS[i] ? `<div class="lgroup"><b>${GROUPS[i][0]}</b><span>${GROUPS[i][1]}</span></div>` : '';
    return `${head}<div class="lrow"><span class="lname"><span class="chips" aria-hidden="true">${chips}</span>${name}</span>
      <span class="ltrack" aria-hidden="true"><i style="width:${ps[i]}%"></i></span><span class="lnum">${ps[i]}%<small>${n} 人</small></span></div>`;
  }).join('');
}

/* 點狀分布：同一個位置的點往上下錯開，不重疊。
   依畫面實際寬度畫圖，手機上文字才不會被縮得太小 */
let lastScores = null;
function renderDist(scores){
  lastScores = scores;
  const W = Math.max(300, Math.round($('#dist').clientWidth || 760));
  const left = W < 500 ? 88 : 104, right = 12, rowH = 92, top = 8, R = W < 500 ? 4.5 : 5.5;
  const X = v => left + v / 100 * (W - left - right);
  const H = top + rowH * 4 + 26;
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="四種動物的分數分布，一個點是一位學生">`;
  [0, 50, 100].forEach(v => {
    out += `<line x1="${X(v)}" x2="${X(v)}" y1="${top}" y2="${top + rowH * 4}" stroke="var(--line)" stroke-width="1"/>`;
    out += `<text x="${X(v)}" y="${top + rowH * 4 + 20}" text-anchor="middle">${v}</text>`;
  });
  TYPES.forEach((t, row) => {
    const cy = top + rowH * row + rowH / 2;
    out += `<text class="tname" x="0" y="${cy + 6}">${LBL(t)}</text>`;
    const used = {};
    (scores[t] || []).forEach(v => {
      const bin = Math.round(X(v) / (R * 2.2));
      const k = used[bin] = (used[bin] || 0) + 1;
      const off = (k % 2 ? 1 : -1) * Math.floor(k / 2) * (R * 2.1);
      if (Math.abs(off) > rowH / 2 - R) return;
      out += `<circle cx="${X(v).toFixed(1)}" cy="${(cy + off).toFixed(1)}" r="${R}" fill="${COLOR[t]}" fill-opacity=".8"/>`;
    });
  });
  $('#dist').innerHTML = out + '</svg>';
}

function setStatus(kind, text){
  const s = $('#status');
  s.className = 'status' + (kind ? ' ' + kind : '');
  $('#status-text').textContent = text;
}
const clock = () => new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});

function showMessage(text){
  $('#msg').textContent = text; $('#msg').hidden = false;
  ['#count','#count-note','#empty','#sec-gender','#sec-animals','#sec-labels','#sec-dist','#foot'].forEach(s => $(s).hidden = true);
}

let timer = null, failures = 0, stopped = false;
async function load(){
  if (stopped) return;
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
    const res = await fetch(CFG.supabaseUrl + '/rest/v1/rpc/class_stats_v2', {
      method: 'POST', signal: ctl.signal,
      headers: {apikey: CFG.supabaseAnonKey, Authorization: 'Bearer ' + CFG.supabaseAnonKey, 'Content-Type': 'application/json'},
      body: JSON.stringify({p_token: TOKEN}),
    });
    clearTimeout(to);
    if (!res.ok) throw new Error(String(res.status));
    const d = await res.json();
    if (!d.ok){
      stopped = true;
      setStatus('off', '已停止更新');
      showMessage('這個統計連結無效或已經到期。請向提供連結的人索取新的連結。');
      return;
    }
    failures = 0;
    $('#msg').hidden = true;
    document.title = `${d.name}｜班級統計`;
    $('#title').textContent = d.name;
    $('#count-n').textContent = d.total; $('#count').hidden = false;
    $('#count-note').hidden = !d.flagged;
    $('#count-note').textContent = d.flagged ? `其中 ${d.flagged} 份可能不太可靠（作答太快，或注意力題沒有照指示選），仍列入下面的統計。` : '';
    const has = d.total > 0;
    $('#empty').hidden = has;
    ['#sec-gender','#sec-animals','#sec-labels','#sec-dist'].forEach(s => $(s).hidden = !has);
    $('#sec-gender').hidden = !has || !d.gender;
    if (has){ if (d.gender) renderGender(d.gender); renderAnimals(d.animals); renderLabels(d.labels); renderDist(d.scores); }
    setStatus('', `自動更新中，最後更新 ${clock()}`);
  } catch (e) {
    failures++;
    setStatus('err', `連線中斷，稍後會自動重試（最後嘗試 ${clock()}）`);
  }
}
function schedule(){
  clearInterval(timer);
  if (!document.hidden && !stopped) timer = setInterval(load, REFRESH_MS);
}
let resizeT = null;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (lastScores) renderDist(lastScores); }, 150); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); schedule(); });

if (!CFG.supabaseUrl || !/^[0-9a-f]{48}$/.test(TOKEN)){
  setStatus('off', '沒有統計資料');
  showMessage('這個統計連結不完整。請確認網址有完整複製，或向提供連結的人索取新的連結。');
} else {
  load(); schedule();
}
</script>
</body>
</html>
