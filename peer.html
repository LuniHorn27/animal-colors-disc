<style>
/* 他評「換個角度看自己」：顏色、字型變數來自 brand/tokens.css（和 index.html 共用），版面元件比照 index.html 結果頁。
   「你自評」和「大家眼中」用形狀區分（實心墨點／空心墨圈），四種動物的顏色只留給動物本身。 */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.75;margin:0}
h1,h2,h3{font-family:var(--font-round);font-weight:400;font-synthesis:none;line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,36px)} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
a{color:inherit}
.wrap{max-width:800px;margin-inline:auto;padding-inline:clamp(16px,4vw,48px);padding-block:28px 64px;box-sizing:content-box}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)} .small{font-size:14px} .note{font-size:13px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 16px;font-size:15px}
.err{color:var(--err);font-size:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500}
.input{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);font:inherit;color:var(--ink);width:100%}
.input::placeholder{color:var(--faint)}
.link-box{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--sunk);border-radius:10px;padding:10px 12px;word-break:break-all;user-select:all}
.warn .link-box{background:var(--surface);color:var(--ink)}
.lead{font-size:17px;line-height:1.65}
/* 產生連結之後 */
.ready,.saved{display:flex;align-items:center;gap:10px}
.saved{align-items:flex-start;gap:12px}
.ready .ok,.saved .ok{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700}
.ready .ok{background:var(--btn);color:var(--btn-ink)}
.saved .ok{background:var(--s);color:#fff}
.url{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stat b{font-family:var(--font-round);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.btn.text{border:none;background:none;min-height:44px;color:inherit;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.btn svg{width:20px;height:20px;flex:none}
ul.dots{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
/* 自評花色 ⇄ 大家眼中（邀請頁）：單一型一個圓、組合型兩個圓、變色龍四色鱗片；還不知道的一邊是打問號的虛線圓 */
.peer-pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;width:100%;max-width:420px;margin-inline:auto}
.peer-pair .f{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.peer-pair .lb{font-size:13px;color:var(--muted)}
.peer-pair .ty{font-family:var(--font-round);font-size:15px;line-height:1.35}
.peer-pair .arrow{color:var(--faint);font-size:20px}
.badge{display:flex;align-items:center;justify-content:center;height:64px}
.badge svg,.badge .ghost{width:56px;height:56px;border-radius:50%;display:block;flex:none}
.badge svg{box-shadow:0 0 0 3px var(--surface)}
.badge svg + svg{margin-left:-14px}
.badge .ghost{border:2.5px dashed var(--faint);background:var(--sunk);display:flex;align-items:center;justify-content:center;font-family:var(--font-round);font-size:28px;color:var(--muted)}
/* 頁首（同 index.html） */
.site-bar{background:var(--surface);border-bottom:1px solid var(--line);padding-inline:clamp(16px,4vw,48px);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:800px;margin-inline:auto;min-height:60px;display:flex;align-items:center;gap:16px}
.bar-brand{display:flex;align-items:center;gap:10px;min-height:44px;min-width:0;font-family:var(--font-round);font-size:18px;line-height:1.3;color:var(--ink);text-decoration:none;flex:0 1 auto}
.bar-brand svg{width:28px;height:28px;flex:none}
.bar-actions{display:flex;gap:4px;flex:none;margin-left:auto}
.bar-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.bar-btn:hover{background:var(--sunk)}
.bar-btn svg{width:20px;height:20px;flex:none}
.bar-btn[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar-btn .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 關係、分組 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip .n{color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}

.top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

.words{display:flex;flex-direction:column;gap:10px}
.pick-head,.word{display:grid;grid-template-columns:minmax(0,1fr) 60px 60px;gap:6px;align-items:center}
.pick-head{padding:0 6px 0 14px;font-size:14px;font-weight:700;text-align:center;margin-bottom:-4px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px}
.word span{font-family:var(--font-round);font-size:18px;min-width:0}
.word.is-most{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
/* 最不像的那一列：虛線框＋灰色底，和「最像」的實線粗框一眼分得出來 */
.word.is-least{border:2px dashed var(--ink);background:var(--sunk);padding:5px 5px 5px 13px}
.pick{display:flex;align-items:center;justify-content:center;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--faint);padding:0}
.pick svg{width:20px;height:20px}
.pick.most[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.pick.least[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.q-hint{font-size:14px;color:var(--muted);min-height:1.6em;margin:0}
/* 結果 */
.legend{display:flex;gap:16px;font-size:14px;align-items:center;flex-wrap:wrap}
.dotc{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dotc.self{background:var(--ink)} .dotc.peer{border:2px solid var(--ink)}
/* 落差說明卡片：左邊粗線用那一型的動物色 */
.gaps{display:flex;flex-direction:column;gap:12px}
.gap{padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gc,var(--line))}
.gap p + p{margin-top:6px}
.gap .gh{display:flex;align-items:center;gap:8px;font-weight:700}
.gap .ask{font-size:14px;color:var(--muted)}
.db{display:flex;flex-direction:column;gap:12px}
.db-row,.db-head,.db-scale{display:grid;grid-template-columns:64px 1fr 34px 34px;column-gap:6px;align-items:center}
.db-row{font-size:14px}
.db-row > span:first-child{white-space:nowrap}
.db-row .v{font-variant-numeric:tabular-nums;text-align:right}
.db-row .v.s{font-weight:700}
.db-head{font-size:12px;color:var(--muted);text-align:right;margin-bottom:-6px}
.db-track{position:relative;height:28px}
.db-track .axis{position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.db-track .mid{position:absolute;left:50%;top:2px;bottom:2px;border-left:1.5px dashed var(--faint)}
.db-track .seg{position:absolute;top:calc(50% - 3px);height:6px;border-radius:3px;background:var(--sunk)}
.db-track .pt{position:absolute;top:calc(50% - 8px);width:16px;height:16px;border-radius:50%;margin-left:-8px}
.db-track .pt.self{background:var(--ink)}
.db-track .pt.peer{background:var(--surface);border:3px solid var(--ink)}
.db-scale{font-size:12px;color:var(--faint)}
.db-scale div{display:flex;justify-content:space-between}
.sec{padding:24px}
.sec h3,h3.hl{font-size:22px;margin-bottom:14px;width:fit-content;max-width:100%}
.sec h3::after,h3.hl::after{content:"";display:block;width:100%;height:4px;border-radius:2px;margin-top:6px;background:var(--main,var(--ink))}
.sec ul{margin:0;padding-left:20px}
.sec li{margin:4px 0}
.tip{margin-top:14px;padding:12px 16px;border-radius:12px;font-size:15px;background:color-mix(in srgb,var(--main,var(--ink)) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--main,var(--ink)) 45%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tip{background:color-mix(in srgb,var(--main,var(--ink)) 24%,var(--surface))}}
:root[data-theme="dark"] .tip{background:color-mix(in srgb,var(--main,var(--ink)) 24%,var(--surface))}
.cham .tip{background:var(--sunk);border-color:transparent}
.tip b{display:block;font-size:14px}
.named{display:flex;flex-direction:column;gap:8px}
.named .row{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:34px}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;background:var(--sunk);color:var(--muted);margin-left:6px}
.back-link{align-self:center;display:inline-flex;align-items:center;min-height:44px;font-size:15px;color:var(--ink);text-underline-offset:4px}
.settings{padding:14px 16px;border-radius:14px;border:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch button{width:52px;height:32px;border-radius:16px;border:1px solid var(--line);background:var(--sunk);position:relative;flex:none}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.switch button[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch button[aria-checked="true"]::after{left:23px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:60}
/* 動物標籤、花紋（同 index.html） */
.ak{display:inline-block;padding:0 7px;border-radius:6px;font-weight:700;color:var(--ink);white-space:nowrap;line-height:1.6}
.ak-D{background:color-mix(in srgb,var(--d) 20%,transparent)} .ak-I{background:color-mix(in srgb,var(--i) 20%,transparent)}
.ak-S{background:color-mix(in srgb,var(--s) 22%,transparent)} .ak-C{background:color-mix(in srgb,var(--c) 20%,transparent)}
/* 開頭頁的四種動物：和主測驗首頁同一種卡片（手機兩欄、電腦四欄，花紋＋動物名＋代號） */
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:4px 0}

.type{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 14px;background:var(--sunk)}
.type .pat{width:34px;height:34px;flex:none;border-radius:50% 50% 50% 6px;display:block}

/* 結果標題（同 index.html 結果頁：組合型的類型代號放在上面那行，雙動物標題維持一行、字級跟著內容欄寬度縮放；一句話用粉圓字） */
.hero{display:flex;flex-direction:column;gap:6px;container-type:inline-size}

.hero h1 .tl{display:block;white-space:nowrap}
.hero h1.two-t{font-size:min(40px,5cqi)}
.hero .one{font-family:var(--font-round);font-synthesis:none;font-size:clamp(18px,4.2cqi,21px);line-height:1.6;color:color-mix(in srgb,var(--main,var(--ink)) 80%,#000)}
:root[data-theme="dark"] .hero .one{color:var(--main,var(--ink))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .one{color:var(--main,var(--ink))}}
/* 朋友作答完：底部固定「換你測測看」（同 index.html 的 .share-dock） */
.cta-dock{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;transition:opacity .2s ease,transform .2s ease}

@media (min-width:768px){
  .cta-dock{left:auto;right:max(clamp(16px,4vw,48px), calc((100vw - 800px) / 2));bottom:24px;padding:0;background:none;border:0}

}

.sent{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 16px 6px 6px;font-size:15px;width:fit-content}
.sent .ok{width:26px;height:26px;border-radius:50%;background:var(--s);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}

.fold-card{--fold-bg:color-mix(in srgb,var(--main,var(--ink)) 12%,var(--surface));display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:20px;border-radius:14px;border:2px solid var(--main,var(--ink));background:var(--fold-bg)}

.fold-h{font-family:var(--font-round);font-size:22px;line-height:1.35}
.fold-peek{position:relative;align-self:stretch;max-height:116px;overflow:hidden;font-size:15px}
.fold-peek ul{margin:0;padding-left:20px} .fold-peek li{margin:4px 0}

/* 作答中要離開時的確認（同 index.html 的「要回到首頁嗎？」） */
.leave{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));z-index:70;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;background:var(--warn-bg);color:var(--warn-ink);box-shadow:0 10px 30px rgba(0,0,0,.25)}
svg text{font-family:var(--font-sans)}

<script>
'use strict';
const B = PeerBank, R = PeerReport, P = PeerBackend, esc = R.esc, $ = (s) => document.querySelector(s);
const TYPES = B.TYPES;
const ANIMAL = { D: '老虎', I: '孔雀', S: '無尾熊', C: '貓頭鷹' };
const COLOR = { D: 'var(--d)', I: 'var(--i)', S: 'var(--s)', C: 'var(--c)' };
const TNAME = { D: '支配', I: '影響', S: '穩定', C: '分析' };
const ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_X = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
const ICON_DOWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- 動物花紋、四瓣花（和 index.html 同一份圖案資料） ---------- */
const PAT = {
  D:{w:44,h:44,rot:-32,scale:.9,base:'#D66A14',els:[['path','M0 9C11 3 24 15 44 7L44 14C25 22 11 10 0 15Z','#3A1C07'],['path','M0 31C13 26 27 37 44 30L44 35C27 43 13 32 0 37Z','#3A1C07']]},
  I:{w:40,h:40,base:'#11968A',els:[['ell',10,11,8,10,0,'#0B4F66'],['ell',10,12,5,6.4,0,'#F3C24F'],['ell',10,13,2.8,2.8,0,'#142A4C'],['ell',30,31,8,10,0,'#0B4F66'],['ell',30,32,5,6.4,0,'#F3C24F'],['ell',30,33,2.8,2.8,0,'#142A4C']]},
  S:{w:36,h:36,base:'#5E9A47',els:[['ell',9,10,3.6,8.5,38,'#3C6B30'],['ell',27,27,3.6,8.5,-38,'#3C6B30'],['ell',27,8,2.2,2.2,0,'#DCEBD3'],['ell',9,28,2.2,2.2,0,'#DCEBD3']]},
  C:{w:20,h:16,base:'#6576DC',els:[['line','M0 16A10 10 0 0 1 20 16M-10 8A10 10 0 0 1 10 8M10 8A10 10 0 0 1 30 8','#222A6E',2]]}
};
function patSVG(t){
  const p = PAT[t];
  const els = p.els.map(e => e[0]==='path' ? `<path d="${e[1]}" fill="${e[2]}"/>`
    : e[0]==='ell' ? `<ellipse cx="${e[1]}" cy="${e[2]}" rx="${e[3]}" ry="${e[4]}" transform="rotate(${e[5]} ${e[1]} ${e[2]})" fill="${e[6]}"/>`
    : `<path d="${e[1]}" fill="none" stroke="${e[2]}" stroke-width="${e[3]}"/>`).join('');
  const tf = p.rot ? ` patternTransform="rotate(${p.rot}) scale(${p.scale})"` : '';
  return `<pattern id="pat-${t}" width="${p.w}" height="${p.h}" patternUnits="userSpaceOnUse"${tf}><rect width="${p.w}" height="${p.h}" fill="${p.base}"/>${els}</pattern>`;
}
// 變色龍花色（品牌識別提案定案的四色鱗片）
document.querySelector('#pat-defs defs').innerHTML = TYPES.map(patSVG).join('') + '<pattern id="pat-X" width="24" height="21" patternUnits="userSpaceOnUse"><rect width="24" height="21" fill="#DADDE2"/><circle cx="6" cy="5" r="4.6" fill="#D66A14"/><circle cx="18" cy="5" r="4.6" fill="#11968A"/><circle cx="0" cy="15.5" r="4.6" fill="#5E9A47"/><circle cx="12" cy="15.5" r="4.6" fill="#6576DC"/><circle cx="24" cy="15.5" r="4.6" fill="#5E9A47"/></pattern>';
const swatch = (t) => `<svg class="pat" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" fill="url(#pat-${t})"/></svg>`;
// 四瓣花：方向同四向圖；半徑用分數的平方根換算，面積才和分數成正比。v：-1~1，0 是四型平均（虛線圓）
const PETAL = { D: [180, 270], I: [270, 360], S: [0, 90], C: [90, 180] };
function petalPath(cx, cy, r, a1, a2) {
  const p = (a) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)].map((x) => +x.toFixed(1));
  const [x1, y1] = p(a1), [x2, y2] = p(a2);
  return `M${cx} ${cy}L${x1} ${y1}A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${x2} ${y2}Z`;
}
function flowerSVG(v, label) {
  const cx = 120, cy = 120, R0 = 100, span = spanOf(v);
  const val = (t) => Math.max(4, Math.min(100, 50 + 45 * v[t] / span));
  const r = (x) => R0 * Math.sqrt(x / 100);
  let g = TYPES.map((t) => `<path class="pt" d="${petalPath(cx, cy, r(val(t)), ...PETAL[t])}" fill="url(#pat-${t})" stroke-width="4"/>`).join('');
  g += `<circle cx="${cx}" cy="${cy}" r="${r(50).toFixed(1)}" fill="none" stroke="var(--surface)" stroke-width="4" opacity=".7"/><circle cx="${cx}" cy="${cy}" r="${r(50).toFixed(1)}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  const L = { D: [4, 14, 'start'], I: [236, 14, 'end'], S: [236, 234, 'end'], C: [4, 234, 'start'] };
  g += TYPES.map((t) => `<text x="${L[t][0]}" y="${L[t][1]}" text-anchor="${L[t][2]}" font-size="13">${t} ${ANIMAL[t]}</text>`).join('');
  return `<svg class="flower" viewBox="0 0 240 240" role="img" aria-label="${esc(label)}">${g}</svg>`;
}

/* ---------- 結果標題：和 index.html 一樣寫成「I 孔雀（影響型）」，組合型依分數高低排 ---------- */
function typesOf(res) {
  const key = keyOf(res);
  if (key === 'CH') return [];
  const ts = key.split('');
  const order = (res && res.order) || TYPES;
  return ts.sort((a, b) => order.indexOf(a) - order.indexOf(b));
}
const mainColor = (res) => { const ts = typesOf(res); return ts.length ? COLOR[ts[0]] : null; };
function heroTitle(res) {
  const ts = typesOf(res);
  if (!ts.length) return '<span class="tl">變色龍（四型均衡）</span>';
  return `<span class="tl">${ts.map((t) => `<span style="color:${COLOR[t]}">${t} ${ANIMAL[t]}（${TNAME[t]}型）</span>`).join(' ＋ ')}</span>`;
}
const heroH1 = (res) => `<h1${typesOf(res).length > 1 ? ' class="two-t"' : ''}>${heroTitle(res)}</h1>`;
// 組合型、對角型的類型代號接在上面那行後面，例如「：DI 組合型」
const heroCode = (res) => { const ts = typesOf(res); return ts.length > 1 ? `：${ts.join('')} ${res && res.kind === 'diag' ? '對角型' : '組合型'}` : ''; };
const ak = (t) => `<span class="ak ak-${t}">${ANIMAL[t]}</span>`;
const akList = (res) => { const ts = typesOf(res); return ts.length ? ts.map(ak).join('＋') : '變色龍'; };
// 本色花色圓：ts 是類型陣列（例如 ['S','C']）；空陣列＝變色龍（四色鱗片）
const badge = (ts) => `<div class="badge">${(ts.length ? ts : [null]).map((t) => `<svg viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="url(#pat-${t || 'X'})"/></svg>`).join('')}</div>`;
const ghostBadge = () => '<div class="badge"><div class="ghost">?</div></div>';
const animalsOf = (ts) => ts.length ? ts.map((t) => ANIMAL[t]).join('＋') : '變色龍';
// 主測驗（index.html）記下的「作答編號 → 本色」，例如 "SC"；找不到時回傳 null
function selfTypesOf(rid) {
  try { const m = JSON.parse(localStorage.getItem('disc-peer-self-v1')) || {}; return rid && typeof m[rid] === 'string' ? m[rid].split('') : null; } catch (e) { return null; }
}
// 對照結果頁：兩邊都知道了，各放自己的花色和類型（小字一律用墨色，動物色只用在圖形和大字）
function duoHTML(selfTs, peerTs) {
  return `<div class="peer-pair">
    <div class="f">${badge(selfTs)}<span class="lb">你自評</span><span class="ty">${animalsOf(selfTs)}</span></div>
    <span class="arrow" aria-hidden="true">⇄</span>
    <div class="f">${badge(peerTs)}<span class="lb">大家眼中</span><span class="ty">${animalsOf(peerTs)}</span></div>
  </div>`;
}
function pairHTML(ts) {
  return `<div class="peer-pair" aria-hidden="true">
    <div class="f">${ts ? badge(ts) : '<div class="badge"><div class="ghost"></div></div>'}<span class="lb">你自評</span>${ts ? `<span class="ty">${animalsOf(ts)}</span>` : ''}</div>
    <span class="arrow">⇄</span>
    <div class="f">${ghostBadge()}<span class="lb">大家眼中</span><span class="ty muted">等朋友回覆</span></div>
  </div>`;
}

/* ---------- 深色模式開關（同 index.html：沒選過時跟著系統，切換後記住） ---------- */
const darkMQ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : !!(darkMQ && darkMQ.matches); };
const syncTheme = () => $('#bar-theme').setAttribute('aria-checked', String(isDark()));
$('#bar-theme').addEventListener('click', () => {
  const t = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; try { localStorage.setItem('disc-theme', t); } catch (e) {}
  syncTheme();
});
if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', syncTheme);
syncTheme();

/* ---------- 作答中要離開時先確認（C2） ---------- */
let quizActive = false;
document.querySelector('.bar-brand').addEventListener('click', (e) => {
  if (!quizActive) return;
  e.preventDefault();
  if (document.querySelector('.leave')) return;
  const box = document.createElement('div');
  box.className = 'leave'; box.setAttribute('role', 'alertdialog'); box.setAttribute('aria-label', '要離開嗎？');
  box.innerHTML = '<p><b>要離開嗎？</b>已經選的答案會消失，回覆也不會送出。</p><div class="btns"><button class="btn primary" data-stay>繼續作答</button><button class="btn" data-go>離開</button></div>';
  document.body.appendChild(box);
  box.querySelector('[data-stay]').focus();
  box.querySelector('[data-stay]').addEventListener('click', () => box.remove());
  box.querySelector('[data-go]').addEventListener('click', () => { quizActive = false; location.href = './'; });
});
const PRIVACY = 'privacy.html#peer';
const app = $('#app');
const view = (html, keepScroll = false) => { app.innerHTML = html; if (!keepScroll) window.scrollTo(0, 0); };
// 網址很快換來換去時，較早、還在等伺服器的畫面不能蓋掉新的：每次 render 拿一個編號，等完伺服器先確認自己還是最新的
let renderId = 0;
class Stale extends Error {}
const still = (my) => { if (my !== renderId) throw new Stale(); };
const pageUrl = (hash) => location.origin + location.pathname + hash;
const keyOf = (r) => (!r || !r.key || r.kind === 'none' || r.kind === 'chameleon') ? 'CH' : r.key;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 2200);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('已複製'); }
  catch (e) { toast('無法自動複製，請長按連結自行複製'); }
}
function message(title, body, actions = '') {
  view(`<div class="stack"><h2>${title}</h2><p class="muted">${body}</p>${actions}</div>`);
}
const failView = () => message('連不上伺服器', '請檢查網路，稍後再試一次。', '<button class="btn primary" onclick="render()">再試一次</button>');

// 回到主測驗看自己的完整結果（首頁有「查看我的結果」；登入的人也可以從「我的歷次結果」打開）
const BACK_LINK = '<a class="back-link" href="./">看我的完整結果</a>';
// 逐一比較的數字：和四型平均的差距 ×100，例如 −12、+38
const fmtGap = (v) => { const n = Math.round(v * 100); return n > 0 ? `+${n}` : n < 0 ? `−${-n}` : '0'; };
// 同一張圖或並排比較時要用同一個刻度：四型分數（-1~1）裡離 0 最遠的值，最小 0.3
function spanOf(...vals) { return Math.max(0.3, ...vals.flatMap((v) => TYPES.map((t) => Math.abs(v[t])))); }

/* =====================================================================
   一、邀請頁（邀請人）
   ===================================================================== */
// from：從主測驗結果頁或「我的歷次結果」進來時，指定替哪一份作答產生邀請
async function renderInvite(my, from = null) {
  await P.init(); still(my);
  const own = P.loadOwner();
  if (own && own.code && own.ownerToken && (!from || !own.responseId || own.responseId === from)) return renderLinks(own);
  if (P.user) {
    const mine = await P.getMyInvites(); still(my);
    const hit = from ? mine.find((x) => x.response_id === from) : null;
    if (hit) { location.hash = '#k=' + hit.code; return; }
    if (!from && mine.length && !P.latestClaim()) { location.hash = '#k=' + mine[0].code; return; }
  }
  if (from && !P.user && !P.resultClaim(from).token) {
    return message('請先登入帳號',
      '這次的結果不是在這個瀏覽器做的。登入帳號後，就能替這次結果邀請朋友。',
      '<button class="btn primary block" id="go-login">登入帳號</button><a class="btn block" href="./">回到首頁</a>') || bindLogin();
  }
  if (!from && !P.latestClaim() && !P.user) {
    return message('請先完成主測驗',
      '「換個角度看自己」是拿你的自評和大家眼中的你對照，所以要先做完主測驗。做完後回到這一頁，就能產生邀請連結。',
      `<a class="btn primary block" href="./">開始我的測驗</a>${P.user ? '' : '<button class="btn block" id="go-login">在其他裝置做過？登入帳號</button>'}`)
      || bindLogin();
  }
  view(`<div class="stack">
    <h1>換個角度看自己</h1>
    <div class="stack" style="gap:6px">
      <p class="lead">1955年心理學理論「周哈里窗」提到，透過他人的回饋，能夠更加全面的認識自己，請朋友、家人、老師花 2–3 分鐘的時間完成測驗，幫助你換一個角度認識自己吧！</p>
      <p class="muted small">邀請他們花 2–3 分鐘，從幾組特質詞中，選出最像你和最不像你的詞。</p>
    </div>
    <div class="card stack" style="gap:8px">
      ${pairHTML(selfTypesOf(from || (P.latestClaim() || {}).id))}
      <p class="small muted" style="text-align:center">朋友選完詞，你就會看到兩邊的對照。</p>
    </div>
    <form class="card stack" id="inv-form" novalidate style="gap:10px">
      <label class="f">大家通常怎麼稱呼你？
        <input class="input" id="nick" maxlength="12" autocomplete="nickname" placeholder="例如：小安、安安" required>
      </label>
      <p class="note" id="nick-hint">朋友會在題目裡看到這個稱呼。</p>
    </form>
    <p class="err" id="inv-err" hidden></p>
    <button class="btn primary block" id="inv-go" form="inv-form" disabled>產生邀請連結</button>
    <ul class="dots small muted">
      <li>建議邀請三位以上，測驗結果會更有參考性，較不會被單一人的既定印象影響</li>
      <li>朋友可以匿名，也可以留名字</li>
      <li>連結不會過期，之後想再邀請別人，傳同一個連結就好</li>
    </ul>
  </div>`);
  const nick = $('#nick'), go = $('#inv-go');
  nick.addEventListener('input', () => {
    const v = nick.value.trim();
    go.disabled = !v;
    $('#nick-hint').textContent = v ? `題目會顯示：「以下哪個詞最像 ${v}？」` : '朋友會在題目裡看到這個稱呼。';
  });
  $('#inv-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const v = nick.value.trim();
    if (!v) return;
    go.disabled = true; go.textContent = '產生中…';
    try {
      const out = await P.createInvite(v, from);
      if (!out) {
        $('#inv-err').innerHTML = '找不到你的測驗結果，請先<a href="./">完成主測驗</a>。';
        $('#inv-err').hidden = false;
        go.disabled = false; go.textContent = '產生邀請連結';
        return;
      }
      renderLinks(P.loadOwner());
    } catch (err) {
      $('#inv-err').textContent = '產生失敗，請稍後再試一次。';
      $('#inv-err').hidden = false;
      go.disabled = false; go.textContent = '產生邀請連結';
    }
  });
}
function bindLogin() {
  const b = $('#go-login');
  if (b) b.addEventListener('click', () => P.signInWithGoogle().catch(() => toast('無法開始登入')));
}

/* ---------- 傳出邀請連結：手機用系統分享選單，另外放「用 LINE 傳送」；不支援分享的瀏覽器，主按鈕改成複製 ---------- */
const ICON_SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const shareText = (nick) => `在你眼中，${nick}是哪一種動物？`;
const lineUrl = (nick, url) => 'https://line.me/R/share?text=' + encodeURIComponent(shareText(nick) + '\n' + url);
function shareBtnsHTML(nick, url, { copy = true, line = true } = {}) {
  return (navigator.share ? `<button class="btn primary block" data-act="share">${ICON_SHARE}傳給朋友</button>` : '<button class="btn primary block" data-act="copy">複製邀請連結</button>')
    + (line ? `<a class="btn block" href="${esc(lineUrl(nick, url))}" target="_blank" rel="noopener">用 LINE 傳送</a>` : '')
    + (copy && navigator.share ? '<button class="btn block" data-act="copy">複製邀請連結</button>' : '');
}
function bindShare(root, nick, url) {
  root.querySelectorAll('[data-act="share"]').forEach((b) => b.addEventListener('click', () =>
    navigator.share({ title: '換個角度看自己', text: shareText(nick), url }).catch(() => {})));
  root.querySelectorAll('[data-act="copy"]').forEach((b) => b.addEventListener('click', () => copy(url)));
}

function renderLinks(own) {
  const inviteUrl = pageUrl('#r=' + own.code), ownerUrl = pageUrl(`#k=${own.code}.${own.ownerToken}`), nick = own.nickname || '';
  const saveHTML = P.user
    ? `<div class="card"><div class="saved"><span class="ok">✓</span><div><p style="font-weight:500">已存到你的帳號</p><p class="small muted">之後在「我的歷次結果」就能回來看。</p></div></div></div>`
    : `<div class="warn stack" style="gap:10px" id="save-box">
        <h3 style="font-size:18px;color:var(--ink)">保存你的結果連結</h3>
        <p class="small">之後要靠它回來看大家眼中的你。登入後會存在帳號裡，換手機也看得到。</p>
        <button class="btn primary block" id="go-login">用 Google 帳號登入保存</button>
        <button class="btn text" id="self-save">不登入，改成自己保存連結</button>
        <div class="stack" id="self-box" style="gap:8px" hidden>
          <p class="small">請存在只有你看得到的地方（例如傳給自己、加入書籤）。<b>不要</b>傳給別人，拿到這個連結的人都能看到結果。</p>
          <div class="link-box">${esc(ownerUrl)}</div>
          <button class="btn block" id="cp-own">複製結果連結</button>
        </div>
      </div>`;
  view(`<div class="stack">
    <h1>換個角度看自己</h1>
    <div class="card stack" style="gap:10px" id="send-box">
      <div class="ready"><span class="ok">✓</span><p style="font-weight:500">邀請連結準備好了</p></div>
      <p class="small muted">傳給朋友、家人、老師，請他們花 2–3 分鐘選出最像你的詞。題目會稱呼你「${esc(nick)}」。</p>
      ${shareBtnsHTML(nick, inviteUrl, { line: false })}
      <p class="url">${esc(inviteUrl.replace(/^https?:\/\//, ''))}</p>
    </div>
    ${saveHTML}
    <div class="card stack" style="gap:10px">
      <div class="stat"><span id="n-line">目前 0 人回覆</span><b id="n-num">0</b></div>
      <a class="btn block" id="go-owner" href="#k=${own.code}.${own.ownerToken}">看對照結果</a>
    </div>
  </div>`);
  bindShare($('#send-box'), nick, inviteUrl);
  const ss = $('#self-save');
  if (ss) ss.addEventListener('click', () => { $('#self-box').hidden = false; ss.hidden = true; });
  const co = $('#cp-own'); if (co) co.addEventListener('click', () => copy(ownerUrl));
  bindLogin();
  // 目前幾個人回覆：有人回覆後，「看對照結果」才變成主要按鈕
  const my = renderId;
  P.getResults(own.code, own.ownerToken).then((res) => {
    if (my !== renderId || !res || !res.groups || !res.groups[0]) return;
    const n = +res.groups[0].n || 0;
    $('#n-line').textContent = n ? `已有 ${n} 人回覆` : '目前 0 人回覆';
    $('#n-num').textContent = n;
    if (n) $('#go-owner').classList.add('primary');
  }).catch(() => {});
}

/* =====================================================================

async function renderRate(code, my) {
  await P.init();
  const inv = await P.getInvite(code); still(my);

  const done = P.loadRated(code);
  if (done) return renderRaterResult(inv.nickname, done, true);
  if (!inv.isOpen) return message('這個邀請目前沒有開放', '邀請你的人已經暫停開放回覆。');
  const nm = `「${esc(inv.nickname)}」`;  // 開頭頁提到被邀請的人時一律用「」框起來
  view(`<div class="stack">
    <h1>在你眼中，<br>${nm}是哪一種動物？</h1>
    <div class="types" aria-hidden="true">${TYPES.map((t) => `<div class="type">${swatch(t)}<span class="tx"><b>${ANIMAL[t]}</b><small>${t} ${TNAME[t]}</small></span></div>`).join('')}</div>
    <div class="stack" style="gap:6px">
      <p class="lead">這是一份 DISC 行為風格測驗，用四種動物代表做事和相處的習慣。周哈里窗提到，有些面向別人看得見，自己卻有盲點；你的選擇，能幫${nm}從另一個視角更認識自己。</p>
      <p class="muted small">共 ${B.ITEM_COUNT} 題，每題選一個<b>最像</b>${nm}的、一個<b>最不像</b>的，約 2–3 分鐘。</p>
    </div>
    <div class="card stack" style="gap:10px">
      <p style="font-weight:500" id="rel-l">你是${nm}的…</p>
      <div class="chips rel" role="group" aria-labelledby="rel-l">${B.RELATIONS.map((r) => `<button type="button" class="chip" aria-pressed="false" data-rel="${r}">${r}</button>`).join('')}</div>
    </div>
    <div class="card stack" style="gap:8px">
      <label class="f">你的名字（選填）
        <input class="input" id="rname" maxlength="20" autocomplete="name">
      </label>
    </div>
    <div class="stack" style="gap:6px">
      <p class="q-hint" id="r-hint">先選你和${nm}的關係，就可以開始。</p>
      <button class="btn primary block" id="r-start" disabled aria-describedby="r-hint">開始</button>
    </div>
  </div>`);
  let relation = null;
  app.querySelectorAll('[data-rel]').forEach((b) => b.addEventListener('click', () => {
    relation = b.dataset.rel;
    app.querySelectorAll('[data-rel]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    $('#r-start').disabled = false;
    $('#r-hint').hidden = true;
  }));
  $('#r-start').addEventListener('click', () => {
    if (!relation) return;
    P.prepareBot();
    runQuiz(code, inv.nickname, relation, $('#rname').value.trim());
  });
}

function runQuiz(code, nick, relation, name) {
  const seq = B.makeSeq(), picks = {}, times = {}, n = seq.length, sid = P.newSid();
  let idx = 0, shownAt = Date.now(), advanceTimer = null, locked = false;
  const nm = esc(nick);

  quizActive = true;
  // 還差什麼才能往下：一個詞不能同時是最像和最不像
  function hint(p, last) {
    if (!p.most && !p.least) return '選一個最像、一個最不像。同一個詞不能兩個都選。';
    if (!p.least) return '再選一個最不像。';
    if (!p.most) return '再選一個最像。';
    return last ? '都選好了，按「送出」。' : '都選好了，馬上跳到下一題。';
  }
  // focus：重畫後要把焦點放回去的按鈕 [詞, most|least]；同一題重畫時不捲動
  function draw(focus = null) {
    const it = seq[idx], key = B.itemKey(it.i), p = picks[key] || {};
    const complete = p.most && p.least, last = idx === n - 1;
    view(`<div class="stack">
      <div class="top"><span>第 ${idx + 1} / ${n} 題</span><span>${Math.round(idx / n * 100)}%</span></div>
      <div class="progress" aria-hidden="true"><i style="width:${idx / n * 100}%"></i></div>
      <p class="qt">以下哪個詞最像「${nm}」？<br>哪個最不像？</p>
      <div class="pick-head" aria-hidden="true"><span></span><span>最像</span><span>最不像</span></div>
      <div class="words">${it.w.map((w) => `<div class="word${p.most === w ? ' is-most' : p.least === w ? ' is-least' : ''}">
        <span>${esc(B.WORDS[w])}</span>
        <button type="button" class="pick most" aria-pressed="${p.most === w}" data-w="${w}" data-k="most" aria-label="${esc(B.WORDS[w])}：最像"${locked ? ' disabled' : ''}>${ICON_CHECK}</button>
        <button type="button" class="pick least" aria-pressed="${p.least === w}" data-w="${w}" data-k="least" aria-label="${esc(B.WORDS[w])}：最不像"${locked ? ' disabled' : ''}>${ICON_X}</button>
      </div>`).join('')}</div>
      <p class="q-hint">${hint(p, last)}</p>
      <p class="err" id="q-err" hidden></p>
      <div class="btns">
        <button class="btn" id="q-prev" ${idx === 0 || locked ? 'disabled' : ''}>上一題</button>
        ${last ? `<button class="btn primary" id="q-send" ${complete ? '' : 'disabled'}>送出</button>`
               : `<button class="btn primary" id="q-next" ${complete ? '' : 'disabled'}>下一題</button>`}
      </div>
    </div>`, !!focus);
    app.querySelectorAll('.pick').forEach((b) => b.addEventListener('click', () => choose(b.dataset.w, b.dataset.k)));
    if (focus) { const f = app.querySelector(`.pick[data-w="${focus[0]}"][data-k="${focus[1]}"]`); if (f) f.focus({ preventScroll: true }); }
    $('#q-prev').addEventListener('click', () => go(-1));
    const nx = $('#q-next'); if (nx) nx.addEventListener('click', () => go(1));
    const sd = $('#q-send'); if (sd) sd.addEventListener('click', send);
  }
  function choose(w, kind) {
    if (locked) return;
    const it = seq[idx], key = B.itemKey(it.i), p = picks[key] = picks[key] || {};
    const other = kind === 'most' ? 'least' : 'most';
    p[kind] = w;
    if (p[other] === w) delete p[other];
    if (p.most && p.least) times[key] = (times[key] || 0) + (Date.now() - shownAt), shownAt = Date.now();
    draw([w, kind]);
    clearTimeout(advanceTimer);
    if (p.most && p.least && idx < n - 1) advanceTimer = setTimeout(() => go(1), 350);
  }
  function go(d) {
    if (locked) return;
    clearTimeout(advanceTimer);
    idx = Math.max(0, Math.min(n - 1, idx + d));
    shownAt = Date.now();
    draw();
  }
  async function send() {
    // 送出後答案就固定：之後重送（同一個號碼牌）送的一定是同一份答案
    locked = true;
    app.querySelectorAll('.pick').forEach((b) => { b.disabled = true; });
    const btn = $('#q-send');
    btn.disabled = true; btn.textContent = '送出中…';
    $('#q-prev').disabled = true;
    seq.forEach((it) => { const k = B.itemKey(it.i); times[k] = Math.min(600000, Math.round(times[k] || 0)); });
    const out = await P.submitRating({ sid, code, relation, name, seq, picks, times });
    if (out.ok) { quizActive = false; return renderRaterResult(nick, out, false); }
    const msg = { closed: '這個邀請目前沒有開放，無法送出。', not_found: '找不到這個邀請，無法送出。',
      network: '網路不穩，請稍後再按一次送出。', invalid: '送出失敗，請重新整理頁面再作答一次。' }[out.error];
    const e = $('#q-err'); e.textContent = msg; e.hidden = false;
    if (out.error === 'network') { btn.disabled = false; btn.textContent = '再送一次'; }
    else btn.textContent = '無法送出';
  }
  draw();
}

const ctaHTML = () => `<div class="card stack" id="cta-card" style="gap:10px;background:var(--selected);border:none">
      <h2 style="font-size:20px">想要了解自己的動物本色嗎？</h2>
      <p class="small">測完後，換你邀請朋友，了解在另一個視角中你是哪一種動物。</p>
      <p class="small muted">46 題｜約 5–10 分鐘</p>
      <a class="btn primary block" href="./">換你測測看</a>
    </div>`;
// 底部固定按鈕列（同主測驗結果頁的「儲存／分享結果圖片」）：一直顯示「換你測測看」；頁尾那張卡片出現在畫面上時先藏起來，同一件事不同時出現兩個按鈕
function setupCtaDock() {
  const dock = $('#cta-dock'), card = $('#cta-card');
  if (!dock || !card) return;
  if (window.IntersectionObserver) {
    const io = new IntersectionObserver((es) => es.forEach((e) => dock.classList.toggle('away', e.isIntersecting)), { threshold: 0.25 });
    io.observe(card);
  }
}

  const main = mainColor(rec.result);

  view(`<div class="stack${key === 'CH' ? ' cham' : ''}" style="gap:20px${main ? ';--main:' + main : ''}">
    ${again ? `<p class="muted small">你已經回覆過「${nm}」了，這是你上次的結果。</p>`
            : `<div class="sent" role="status"><span class="ok" aria-hidden="true">✓</span>已送給「${nm}」，謝謝你！</div>`}
    <div class="hero">

      <p class="note" style="text-align:center">花瓣越大，代表在你眼中越明顯；虛線是四種動物的平均。</p>
    </div>
    <div class="fold-card" id="fold">
      <p class="fold-h">${R.fill('{name}的完整解析', nick)}</p>
      <div class="fold-peek" aria-hidden="true"><ul>${peek.map((x) => `<li>${x}</li>`).join('')}</ul></div>
      <button type="button" class="fold-btn" aria-expanded="false" aria-controls="fold-body">看完整解析${ICON_DOWN}</button>
      <div class="fold-body" id="fold-body" hidden>
        ${secs.map((x) => `<div class="card sec"><h3>${x.title}</h3><ul>${x.items.map((y) => `<li>${y}</li>`).join('')}</ul>${x.tip ? `<div class="tip"><b>${x.tip[0]}</b>${x.tip[1]}</div>` : ''}</div>`).join('')}
      </div>
    </div>
    <p class="note">只根據你一個人的 ${B.ITEM_COUNT} 題作答，題目少、尚未驗證，僅供參考。「${nm}」自己的測驗結果和其他人的回覆，你都看不到。</p>
    <p class="note">回覆編號：${esc(rec.ref || '')}（想刪除這筆回覆時，請附上這個編號，詳見<a href="${PRIVACY}">隱私說明</a>）</p>
    ${ctaHTML()}
  </div>
  <div class="cta-dock" id="cta-dock"><a class="btn primary" href="./">換你測測看</a></div>`);
  setupCtaDock();
  const fold = $('#fold'), fb = fold.querySelector('.fold-btn');
  fb.addEventListener('click', () => {
    const open = fb.getAttribute('aria-expanded') !== 'true';
    fb.setAttribute('aria-expanded', String(open));
    fb.firstChild.textContent = open ? '收起解析' : '看完整解析';
    fold.classList.toggle('open', open);
    $('#fold-body').hidden = !open;
  });
}

   三、對照結果頁（邀請人）
   ===================================================================== */
async function renderOwner(code, token, my) {
  await P.init(); still(my);
  const own = P.loadOwner();
  if (!token && own && own.code === code) token = own.ownerToken;
  const res = await P.getResults(code, token); still(my);
  if (!res) {
    if (own && own.code === code) P.saveOwner(null);
    return message('這個連結已經失效',
      '可能已經在其他裝置重新產生過連結，舊的專屬結果連結就不能再用了。請用最新的連結，或登入帳號後再打開。',
      `${P.user ? '' : '<button class="btn primary block" id="go-login">登入帳號</button>'}<a class="btn block" href="#">回到邀請頁</a>`) || bindLogin();
  }
  if (token && !P.user && (!own || own.code !== code || own.ownerToken !== token)) P.saveOwner({ code, ownerToken: token, nickname: res.nickname });
  let group = '全部';
  // keep：重畫時不捲回最上面（切換頁尾的開關時用）
  const draw = (keep = false) => {
    const g = res.groups.find((x) => x.relation === group) || res.groups[0];
    const total = res.groups[0].n, few = total > 0 && total < 3;  // 少於 3 人時提醒再邀請幾位
    const inviteUrl = pageUrl('#r=' + code);
    let body;
    if (!total) {
      // 還沒有人回覆：先放自己的花色和打問號的「大家眼中」，提醒自己的結果是什麼
      body = `<div class="card stack" style="gap:10px;text-align:center" id="empty-box">
        ${pairHTML(typesOf(res.self_result))}
        <p style="font-weight:700">還沒有人回覆</p>
        <p class="small muted">把邀請連結傳給朋友、家人或老師，有人回覆就會出現在這裡。</p>
        ${shareBtnsHTML(res.nickname || '', inviteUrl, { copy: false })}
      </div>
      ${BACK_LINK}`;
    } else {
      const selfN = B.normSelf(res.self_mean), peerN = B.normPeer(g.scores), span = spanOf(selfN, peerN);
      const selfKey = keyOf(res.self_result), peerRes = B.classify(g.scores), peerKey = peerRes.key;
      const pos = (x) => (50 + (x / span) * 45).toFixed(1);
      const rows = TYPES.map((t) => {
        const a = pos(selfN[t]), b = pos(peerN[t]), lo = Math.min(a, b), w = Math.abs(a - b);
        return `<div class="db-row"><span><span class="dotc" style="background:${COLOR[t]}"></span>${ANIMAL[t]}</span>
          <div class="db-track"><div class="axis"></div><div class="mid"></div><div class="seg" style="left:${lo}%;width:${w}%"></div>
          <div class="pt peer" style="left:${b}%"></div><div class="pt self" style="left:${a}%"></div></div>
          <span class="v s">${fmtGap(selfN[t])}</span><span class="v">${fmtGap(peerN[t])}</span></div>`;
      }).join('');
      const lines = B.gapLines(selfN, peerN);
      // 落差說明：每一型一張卡片，開頭標動物和「你可能沒注意到的一面／大家比較少看見的一面」
      const gapCard = (x) => { const g2 = R.GAP[x.dir === 'peer' ? 'up' : 'down'];
        return `<div class="gap" style="--gc:${COLOR[x.t]}"><p class="gh">${ak(x.t)}${g2.title}</p><p>${g2[x.t][0]}</p><p class="ask">可以問問他們：${g2[x.t][1]}</p></div>`; };
      const gapHTML = lines.length ? lines.map(gapCard).join('') : `<div class="gap"><p>${R.GAP.same}</p></div>`;
      // 每個人眼中的你：留名字的人（名字＋關係＋類型），接著是匿名的人（只寫「匿名」和類型，不顯示關係）。
      // 後端升級 v12 之前沒有 anon 清單，匿名的人只顯示人數
      const anonList = Array.isArray(res.anon) ? res.anon : null;
      const rowsNamed = res.named.map((x) => `<div class="row"><span>${esc(x.name)}<span class="tag">${esc(x.relation)}</span></span><span>${akList(x.result)}</span></div>`).join('');
      const rowsAnon = anonList ? anonList.map((x) => `<div class="row"><span class="muted">匿名</span><span>${akList(x.result)}</span></div>`).join('') : '';
      const anonNote = anonList ? '' : res.n_anon ? `<p class="small muted">另有 ${res.n_anon} 位匿名，只算進上面的平均。</p>` : '';
      const named = rowsNamed || rowsAnon ? `<div class="card named">
          <p style="font-weight:700">每個人眼中的你</p>
          ${rowsNamed}${rowsAnon}${anonNote}
        </div>` : `<p class="small muted">${res.n_anon} 位都是匿名，只算進上面的平均。</p>`;
      // 最上面的結論：大家眼中的類型＋一句和自評的對照（用落差最大的那一型）
      const up = lines.find((x) => x.dir === 'peer'), down = lines.find((x) => x.dir === 'self');
      const selfA = animalsOf(typesOf(res.self_result));
      const sentence = up ? `你自評是${selfA}。大家眼中的你，比你想的更${B.FEATURE[up.t]}。`
        : down ? `你自評是${selfA}。你覺得自己${B.FEATURE[down.t]}，大家比較少感受到。`
        : `你自評是${selfA}。大家眼中的你，和你自評的樣子很接近。`;
      const who = group === '全部' ? `在 ${g.n} 個人眼中` : `在 ${g.n} 位${esc(group)}眼中`;
      body = `<div class="chips" role="group" aria-label="依關係篩選">${res.groups.map((x) => `<button type="button" class="chip" aria-pressed="${x.relation === group}" data-g="${x.relation}">${x.relation}<span class="n">${x.n}</span></button>`).join('')}</div>
        ${few ? `<div class="warn stack" style="gap:10px" id="few-box"><p>目前只有 ${total} 個人回覆，再邀請幾位，結果會更穩定。</p>${shareBtnsHTML(res.nickname || '', inviteUrl, { copy: false, line: false })}</div>` : ''}
        <div class="hero" style="--main:${mainColor(peerRes) || 'var(--ink)'}">
          <p class="eyebrow">${who}，你的動物本色${heroCode(peerRes)}</p>
          ${heroH1(peerRes)}
          <p class="one">${sentence}</p>
        </div>
        <div class="card stack" style="gap:8px">${duoHTML(typesOf(res.self_result), typesOf(peerRes))}${BACK_LINK}</div>
        <div class="gaps">${gapHTML}</div>
        ${few ? '' : `<div class="card stack" style="gap:10px" id="more-box">
          <div class="stat"><span style="font-weight:700">已有 ${total} 人回覆</span><b>${total}</b></div>
          <p class="small muted">再邀請幾位，結果會更完整。</p>
          ${shareBtnsHTML(res.nickname || '', inviteUrl, { copy: false })}
        </div>`}
        <div class="card db">
          <p style="font-weight:700">四種動物逐一比較</p>
          <div class="legend"><span><span class="dotc self"></span>你自評</span><span><span class="dotc peer"></span>大家眼中（${g.n} 人${g.n > 1 ? '平均' : ''}）</span></div>
          <div class="db-head" aria-hidden="true"><span></span><span></span><span>你</span><span>大家</span></div>
          ${rows}
          <div class="db-scale"><span></span><div><span>較少</span><span>平均</span><span>較常</span></div><span></span><span></span></div>
          <p class="note">數字是和平均的差距：0 是四種動物的平均，正數代表比平均更常展現，負數代表比較少展現。兩邊的題目不同，已換算成同一個尺度（暫定），適合比較高低，不適合和主測驗的分數直接比。</p>
        </div>
        ${named}
        <p class="note">題目少、尚未驗證，類型和落差僅供參考。</p>`;
    }
    view(`<div class="stack">
      <h1 style="font-size:24px">換個角度看自己</h1>
      ${body}
      <div class="settings">
        <div class="switch"><span id="sw-l">繼續開放回覆</span><button type="button" role="switch" aria-labelledby="sw-l" aria-describedby="sw-d" aria-checked="${res.is_open}" id="sw"></button></div>
        <p class="note" id="sw-d">關掉後連結還在，但沒辦法再送出新的回覆。之後可以再打開。</p>
      </div>
    </div>`, keep);
    app.querySelectorAll('[data-g]').forEach((b) => b.addEventListener('click', () => { group = b.dataset.g; draw(); }));
    ['#more-box', '#few-box', '#empty-box'].forEach((q) => { const el = $(q); if (el) bindShare(el, res.nickname || '', inviteUrl); });
    $('#sw').addEventListener('click', async (e) => {
      const want = !res.is_open, b = e.currentTarget;
      b.disabled = true;
      try {
        if (!(await P.setOpen(code, token, want))) throw new Error('rejected');
        res.is_open = want;
        toast(want ? '已重新開放回覆' : '已停止開放回覆');
      } catch (err) { toast('設定失敗，請稍後再試'); }
      draw(true);
      $('#sw').focus({ preventScroll: true });
    });
  };
  draw();
}

/* ---------- 路由 ---------- */
async function render() {
  if (!P.enabled) return message('目前無法使用', '網站還沒有設定好後端，請稍後再試。');
  const h = P.parseHash(location.hash);
  const my = ++renderId;
  try {
    if (h.mode === 'rate') await renderRate(h.code, my);
    else if (h.mode === 'owner') await renderOwner(h.code, h.token, my);
    else await renderInvite(my, h.from || null);
  } catch (e) { if (!(e instanceof Stale) && my === renderId) failView(); }
}
window.addEventListener('hashchange', render);
render();
