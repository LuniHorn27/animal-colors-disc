<!doctype html>
<html lang="zh-Hant-TW">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>換個角度看自己｜動物本色</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<!-- 測試階段：還沒從主測驗加入口，先不讓搜尋引擎收錄 -->
<meta name="robots" content="noindex">
<meta name="description" content="在你眼中，我是哪一種動物？花 2–3 分鐘，從幾組敘述裡選出最像我、最不像我的。">
<!-- 連結預覽（LINE、Facebook 等）：收到這個網址的多半是被邀請的朋友，所以文字寫給朋友看。換網域時 og:url、og:image 要一起改 -->
<meta property="og:url" content="https://animal-colors-disc.pages.dev/peer.html">
<meta property="og:type" content="website">
<meta property="og:title" content="在你眼中，我是哪一種動物？">
<meta property="og:description" content="花 2–3 分鐘，從幾組敘述裡選出最像我、最不像我的。">
<meta property="og:image" content="https://animal-colors-disc.pages.dev/brand/og-peer.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="在你眼中，我是哪一種動物？12 題，約 2–3 分鐘">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="brand/tokens.css">
<style>
/* 他評「換個角度看自己」：顏色、字型變數來自 brand/tokens.css（和 index.html 共用），版面元件比照 index.html 結果頁。
   「你自評」和「大家眼中」用形狀區分（實心墨點／空心墨圈），四種動物的顏色只留給動物本身。 */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.75;margin:0}
h1,h2,h3{font-family:var(--font-round);font-weight:400;font-synthesis:none;line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,36px)} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
a{color:inherit}
.wrap{max-width:800px;margin-inline:auto;padding-inline:clamp(16px,4vw,48px);padding-block:28px 64px;box-sizing:content-box}
.stack{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.muted{color:var(--muted)} .small{font-size:15px} .note{font-size:14px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 16px;font-size:16px}
.err{color:var(--err);font-size:15px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500}
.input{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);font:inherit;color:var(--ink);width:100%}
.input::placeholder{color:var(--faint)}
.link-box{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--sunk);border-radius:10px;padding:10px 12px;word-break:break-all;user-select:all}
.warn .link-box{background:var(--surface);color:var(--ink)}
.lead{font-size:18px;line-height:1.65}
/* 產生連結之後 */
.ready,.saved{display:flex;align-items:center;gap:10px}
.saved{align-items:flex-start;gap:12px}
.ready .ok,.saved .ok{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700}
.ready .ok{background:var(--btn);color:var(--btn-ink)}
.saved .ok{background:var(--s);color:#fff}
.url{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stat b{font-family:var(--font-round);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.btn.text{border:none;background:none;min-height:44px;color:inherit;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.btn svg{width:20px;height:20px;flex:none}
ul.dots{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
/* 自評花色 ⇄ 大家眼中（邀請頁）：單一型一個圓、組合型兩個圓、變色龍四色鱗片；還不知道的一邊是打問號的虛線圓 */
.peer-pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;width:100%;max-width:420px;margin-inline:auto}
.peer-pair .f{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.peer-pair .lb{font-size:14px;color:var(--muted)}
.peer-pair .ty{font-family:var(--font-round);font-size:16px;line-height:1.35}
.peer-pair .arrow{color:var(--faint);font-size:20px}
.badge{display:flex;align-items:center;justify-content:center;height:64px}
.badge svg,.badge .ghost{width:56px;height:56px;border-radius:50%;display:block;flex:none}
.badge svg{box-shadow:0 0 0 3px var(--surface)}
.badge svg + svg{margin-left:-14px}
.badge .ghost{border:2.5px dashed var(--faint);background:var(--sunk);display:flex;align-items:center;justify-content:center;font-family:var(--font-round);font-size:28px;color:var(--muted)}
/* 頁首（同 index.html） */
.site-bar{background:var(--surface);border-bottom:1px solid var(--line);padding-inline:clamp(16px,4vw,48px);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:800px;margin-inline:auto;min-height:60px;display:flex;align-items:center;gap:16px}
.bar-brand{display:flex;align-items:center;gap:10px;min-height:44px;min-width:0;font-family:var(--font-round);font-size:18px;line-height:1.3;color:var(--ink);text-decoration:none;flex:0 1 auto}
.bar-brand svg{width:28px;height:28px;flex:none}
/* 品牌字太窄要換行時，只在「測出你的｜動物本色」中間斷（字串裡有零寬空格，其他地方不斷） */
.bar-brand span{word-break:keep-all}
.bar-actions{display:flex;gap:4px;flex:none;margin-left:auto}
.bar-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.bar-btn:hover{background:var(--sunk)}
.bar-btn svg{width:20px;height:20px;flex:none}
.bar-btn[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar-btn .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 關係、分組 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px;font-size:16px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip .n{color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
/* 作答 */
.top{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--btn);transition:width .2s}
.qt{font-family:var(--font-round);font-size:clamp(22px,2.6vw,28px);line-height:1.5}
.words{display:flex;flex-direction:column;gap:12px}
.pick-head,.word{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;gap:8px;align-items:center}
.pick-head{padding:0 8px 0 16px;font-size:15px;font-weight:700;text-align:center;margin-bottom:-4px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 16px}
.word span{font-family:var(--font-round);font-size:19px;min-width:0}
.word.is-most{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
/* 最不像的那一列：虛線框＋灰色底，和「最像」的實線粗框一眼分得出來 */
.word.is-least{border:2px dashed var(--ink);background:var(--sunk);padding:7px 7px 7px 15px}
.pick{display:flex;align-items:center;justify-content:center;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--faint);padding:0}
.pick svg{width:20px;height:20px}
.pick.most[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.pick.least[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.q-hint{font-size:15px;color:var(--muted);min-height:1.6em;margin:0}
/* 結果 */
.legend{display:flex;gap:16px;font-size:15px;align-items:center;flex-wrap:wrap}
.dotc{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dotc.self{background:var(--ink)} .dotc.peer{border:2px solid var(--ink)}
/* 落差說明卡片：左邊粗線用那一型的動物色 */
.gaps{display:flex;flex-direction:column;gap:12px}
.gap{padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gc,var(--line))}
.gap p + p{margin-top:6px}
.gap .gh{display:flex;align-items:center;gap:8px;font-weight:700}
.gap .ask{font-size:15px;color:var(--muted)}
.db{display:flex;flex-direction:column;gap:12px}
.db-row,.db-head,.db-scale{display:grid;grid-template-columns:64px 1fr 30px 30px;column-gap:6px;align-items:center}
.db-row{font-size:15px}
.db-row > span:first-child{white-space:nowrap}
.db-row .v{font-variant-numeric:tabular-nums;text-align:right}
.db-row .v.s{font-weight:700}
.db-head{font-size:13px;color:var(--muted);text-align:right;margin-bottom:-6px}
.db-track{position:relative;height:28px}
.db-track .axis{position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.db-track .mid{position:absolute;left:50%;top:2px;bottom:2px;border-left:1.5px dashed var(--faint)}
.db-track .seg{position:absolute;top:calc(50% - 3px);height:6px;border-radius:3px;background:var(--sunk)}
.db-track .pt{position:absolute;top:calc(50% - 8px);width:16px;height:16px;border-radius:50%;margin-left:-8px}
.db-track .pt.self{background:var(--ink)}
.db-track .pt.peer{background:var(--surface);border:3px solid var(--ink)}
.db-scale{font-size:13px;color:var(--faint)}
.db-scale div{display:flex;justify-content:space-between}
.sec{padding:24px}
.sec h3,h3.hl{font-size:22px;margin-bottom:14px;width:fit-content;max-width:100%}
.sec h3::after,h3.hl::after{content:"";display:block;width:100%;height:4px;border-radius:2px;margin-top:6px;background:var(--main,var(--ink))}
.sec ul{margin:0;padding-left:20px}
.sec li{margin:4px 0}
.tip{margin-top:14px;padding:12px 16px;border-radius:12px;font-size:16px;background:color-mix(in srgb,var(--main,var(--ink)) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--main,var(--ink)) 45%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tip{background:color-mix(in srgb,var(--main,var(--ink)) 24%,var(--surface))}}
:root[data-theme="dark"] .tip{background:color-mix(in srgb,var(--main,var(--ink)) 24%,var(--surface))}
.cham .tip{background:var(--sunk);border-color:transparent}
.tip b{display:block;font-size:15px}
.named{display:flex;flex-direction:column;gap:8px}
.named .row{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:34px}
.tag{display:inline-block;font-size:13px;border-radius:6px;padding:0 6px;background:var(--sunk);color:var(--muted);margin-left:6px}
.back-link{align-self:center;display:inline-flex;align-items:center;min-height:44px;font-size:15px;color:var(--ink);text-underline-offset:4px}
.settings{padding:16px 18px;border-radius:14px;border:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch button{width:52px;height:32px;border-radius:16px;border:1px solid var(--line);background:var(--sunk);position:relative;flex:none}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.switch button[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch button[aria-checked="true"]::after{left:23px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:15px;z-index:60}
/* 動物標籤、花紋（同 index.html） */
.ak{display:inline-block;padding:0 7px;border-radius:6px;font-weight:700;color:var(--ink);white-space:nowrap;line-height:1.6}
.ak-D{background:color-mix(in srgb,var(--d) 20%,transparent)} .ak-I{background:color-mix(in srgb,var(--i) 20%,transparent)}
.ak-S{background:color-mix(in srgb,var(--s) 22%,transparent)} .ak-C{background:color-mix(in srgb,var(--c) 20%,transparent)}
/* 開頭頁的四種動物：和主測驗首頁同一種卡片（手機兩欄、電腦四欄，花紋＋動物名＋代號） */
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:4px 0}
@media (min-width:768px){.types{grid-template-columns:repeat(4,minmax(0,1fr))}}
.type{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 14px;background:var(--sunk)}
.type .pat{width:34px;height:34px;flex:none;border-radius:50% 50% 50% 6px;display:block}
.type .tx{display:flex;flex-direction:column;line-height:1.35}
.type b{font-size:16px}
.type .tx small{font-size:14px;color:var(--muted);font-weight:400}
/* 頁尾「測出自己的動物本色」卡片的底色和 --sunk 幾乎一樣（深色模式完全一樣），卡片裡的小卡改用 --surface 才分得出格子 */
#cta-card .type{background:var(--surface)}
/* 英文的類型名稱比較長（Conscientiousness）：同 index.html，窄螢幕時一欄一個、長字可以換行 */
:lang(en) .type small{font-size:12px;overflow-wrap:anywhere}
@media (max-width:520px){:lang(en) .types{grid-template-columns:1fr}}
.chips.rel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.chips.rel .chip{padding:0}
/* 結果標題（同 index.html 結果頁：組合型的類型代號放在上面那行，雙動物標題維持一行、字級跟著內容欄寬度縮放；一句話用粉圓字） */
.hero{display:flex;flex-direction:column;gap:6px;container-type:inline-size}
.hero .eyebrow{font-size:15px;color:var(--muted)}
.hero h1{font-size:clamp(28px,8vw,44px)}
.hero h1 .tl{display:block;white-space:nowrap}
.hero h1.two-t{font-size:min(40px,5cqi)}
.hero .one{font-family:var(--font-round);font-synthesis:none;font-size:clamp(18px,4.2cqi,21px);line-height:1.6;color:var(--main,var(--ink))}
/* 朋友作答完：底部固定「測出自己的動物本色」（同 index.html 的 .share-dock） */
.cta-dock{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;transition:opacity .2s ease,transform .2s ease}
.cta-dock .btn{width:100%;max-width:480px}
.cta-dock.away{opacity:0;transform:translateY(16px);pointer-events:none;visibility:hidden;transition:opacity .2s ease,transform .2s ease,visibility 0s .2s}
#app:has(.cta-dock){padding-bottom:88px}
/* 朋友作答完的本色組成：和主測驗結果頁一樣，左邊本色花色圓，右邊比例和頭冠（從 index.html 搬過來） */
.donut-side{display:grid;grid-template-columns:minmax(130px,200px) minmax(150px,1fr);grid-template-areas:"pie legend" "pie notes";column-gap:clamp(16px,4vw,32px);row-gap:8px;align-items:start;margin-top:8px}
.donut-side .donut{align-self:center}
/* 手機寬度：灰色說明改成整行放在圓餅圖下面，卡片才不會太高 */
@media (max-width:767.98px){.donut-side{grid-template-areas:"pie legend" "notes notes"}}
/* 左邊不畫圓餅圖，只放本色的花色圓（單一型一個、組合型兩個疊在一起、變色龍用變色龍花色），下面寫「你的本色」和動物名稱 */
.donut{grid-area:pie;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.donut .cs{display:flex;justify-content:center;width:100%}
.donut .cs svg{width:min(120px,80%);aspect-ratio:1;height:auto;border-radius:50%;display:block;flex:none;box-shadow:0 0 0 4px var(--surface)}
/* 組合型兩個圓：各占欄寬約六成、疊一點，加起來不超出欄寬 */
.donut .cs svg:first-child:nth-last-child(2),.donut .cs svg + svg{width:min(100px,58%)}
.donut .cs svg + svg{margin-left:-14%}
.donut .ty span{white-space:nowrap}
.donut .lb{font-size:15px;color:var(--muted)}
.donut .ty{font-family:var(--font-round);font-size:clamp(16px,4.6vw,20px);font-weight:700;line-height:1.3}
.donut-legend{grid-area:legend;list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:15px;font-weight:700;align-self:center}
.donut-legend li{display:flex;align-items:center;gap:8px;margin:0;min-width:0;white-space:nowrap}
.donut-legend svg.pat{width:18px;height:18px;border-radius:50%;flex:none}
.crown{width:24px;height:21px;flex:none;margin-left:-1px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
@media (max-width:767.98px){.crown{width:18px;height:16px}}
:root{--crown-gold-edge:#8A5A00;--crown-gold-gem:#C8372D;--crown-silver-edge:#5F6772;--crown-silver-gem:#3E6FB8}
.donut-legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.donut-side .notes{grid-area:notes;margin:0;padding-left:18px;font-size:15px;color:var(--muted);display:grid;gap:4px}
@media (min-width:768px){
  .cta-dock{left:auto;right:max(clamp(16px,4vw,48px), calc((100vw - 800px) / 2));bottom:24px;padding:0;background:none;border:0}
  .cta-dock .btn{width:auto;border-radius:999px;padding:0 22px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
}
/* 送出後的確認列：小小一條，讓結果標題當主角 */
.sent{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 16px 6px 6px;font-size:16px;width:fit-content}
.sent .ok{width:26px;height:26px;border-radius:50%;background:var(--s);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.flower{width:100%;max-width:280px;display:block;margin:0 auto}
.flower text{fill:var(--ink);font-weight:700}
.flower .pt{stroke:var(--surface)}
.fold-card{--fold-bg:color-mix(in srgb,var(--main,var(--ink)) 12%,var(--surface));display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:20px;border-radius:14px;border:2px solid var(--main,var(--ink));background:var(--fold-bg)}
:root[data-theme="dark"] .fold-card{--fold-bg:color-mix(in srgb,var(--main,var(--ink)) 18%,var(--surface))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fold-card{--fold-bg:color-mix(in srgb,var(--main,var(--ink)) 18%,var(--surface))}}
.fold-h{font-family:var(--font-round);font-size:22px;line-height:1.35}

<script>
'use strict';
const B = PeerBank, R = PeerReport, P = PeerBackend, esc = R.esc, $ = (s) => document.querySelector(s);
const TYPES = B.TYPES;
const COLOR = { D: 'var(--d)', I: 'var(--i)', S: 'var(--s)', C: 'var(--c)' };

/* ---------- 語言：網址 ?lang= → 上次選的（disc-lang，和主測驗共用）→ 中文 ---------- */
const storedLang = () => { try { return localStorage.getItem('disc-lang'); } catch (e) { return null; } };
let X = PeerI18n.makeT(PeerI18n.pickLang(location.search, storedLang()), window.PEER_LANG_EN);
const T = (key, vars) => X.t(key, vars);
let ANIMAL, TNAME;
function useLang() {
  R.use(X.lang === 'en' ? window.PEER_LANG_EN.report : null);
  ANIMAL = Object.fromEntries(TYPES.map((c) => [c, X.animal(c)]));
  TNAME = Object.fromEntries(TYPES.map((c) => [c, X.tname(c)]));
}
useLang();
const wordOf = (w) => X.word(w, B.WORDS);
const featureOf = (c) => X.lang === 'en' ? window.PEER_LANG_EN.report.FEATURE[c] : B.FEATURE[c];
// 靜態文字（標題列）：換語言時一起換
function applyStatic() {
  document.documentElement.lang = X.lang === 'en' ? 'en' : 'zh-Hant-TW';
  document.title = T('doc.title');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = T(el.dataset.i18n); });
}
const ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_X = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
const ICON_DOWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- 動物花紋、四瓣花（和 index.html 同一份圖案資料） ---------- */
const PAT = {
  D:{w:44,h:44,rot:-32,scale:.9,base:'#D66A14',els:[['path','M0 9C11 3 24 15 44 7L44 14C25 22 11 10 0 15Z','#3A1C07'],['path','M0 31C13 26 27 37 44 30L44 35C27 43 13 32 0 37Z','#3A1C07']]},
  I:{w:40,h:40,base:'#11968A',els:[['ell',10,11,8,10,0,'#0B4F66'],['ell',10,12,5,6.4,0,'#F3C24F'],['ell',10,13,2.8,2.8,0,'#142A4C'],['ell',30,31,8,10,0,'#0B4F66'],['ell',30,32,5,6.4,0,'#F3C24F'],['ell',30,33,2.8,2.8,0,'#142A4C']]},
  S:{w:36,h:36,base:'#5E9A47',els:[['ell',9,10,3.6,8.5,38,'#3C6B30'],['ell',27,27,3.6,8.5,-38,'#3C6B30'],['ell',27,8,2.2,2.2,0,'#DCEBD3'],['ell',9,28,2.2,2.2,0,'#DCEBD3']]},
  C:{w:20,h:16,base:'#6576DC',els:[['line','M0 16A10 10 0 0 1 20 16M-10 8A10 10 0 0 1 10 8M10 8A10 10 0 0 1 30 8','#222A6E',2]]}
};
function patSVG(t){
  const p = PAT[t];
  const els = p.els.map(e => e[0]==='path' ? `<path d="${e[1]}" fill="${e[2]}"/>`
    : e[0]==='ell' ? `<ellipse cx="${e[1]}" cy="${e[2]}" rx="${e[3]}" ry="${e[4]}" transform="rotate(${e[5]} ${e[1]} ${e[2]})" fill="${e[6]}"/>`
    : `<path d="${e[1]}" fill="none" stroke="${e[2]}" stroke-width="${e[3]}"/>`).join('');
  const tf = p.rot ? ` patternTransform="rotate(${p.rot}) scale(${p.scale})"` : '';
  return `<pattern id="pat-${t}" width="${p.w}" height="${p.h}" patternUnits="userSpaceOnUse"${tf}><rect width="${p.w}" height="${p.h}" fill="${p.base}"/>${els}</pattern>`;
}
// 頭冠的漸層（本色組成的比例旁邊用）
const CROWN_DEFS = `<linearGradient id="crown-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE897"/><stop offset=".55" stop-color="#F4B72E"/><stop offset="1" stop-color="#C98512"/></linearGradient>
  <linearGradient id="crown-gold-band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9A21B"/><stop offset="1" stop-color="#A86A06"/></linearGradient>
  <linearGradient id="crown-silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#D2D7DE"/><stop offset="1" stop-color="#9DA5B0"/></linearGradient>
  <linearGradient id="crown-silver-band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9C0CA"/><stop offset="1" stop-color="#7D8691"/></linearGradient>`;
// 變色龍花色（品牌識別提案定案的四色鱗片）
document.querySelector('#pat-defs defs').innerHTML = TYPES.map(patSVG).join('') + '<pattern id="pat-X" width="24" height="21" patternUnits="userSpaceOnUse"><rect width="24" height="21" fill="#DADDE2"/><circle cx="6" cy="5" r="4.6" fill="#D66A14"/><circle cx="18" cy="5" r="4.6" fill="#11968A"/><circle cx="0" cy="15.5" r="4.6" fill="#5E9A47"/><circle cx="12" cy="15.5" r="4.6" fill="#6576DC"/><circle cx="24" cy="15.5" r="4.6" fill="#5E9A47"/></pattern>' + CROWN_DEFS;
const swatch = (t) => `<svg class="pat" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" fill="url(#pat-${t})"/></svg>`;
// 四種動物小卡（同主測驗首頁）：開頭頁和頁尾「測出自己的動物本色」卡片都用
const typesHTML = () => `<div class="types" aria-hidden="true">${TYPES.map((t) => `<div class="type">${swatch(t)}<span class="tx"><b>${ANIMAL[t]}</b><small>${t} ${TNAME[t]}</small></span></div>`).join('')}</div>`;

/* ---------- 結果標題：和 index.html 一樣寫成「I 孔雀（影響型）」，組合型依分數高低排 ---------- */
function typesOf(res) {
  const key = keyOf(res);
  if (key === 'CH') return [];
  const ts = key.split('');
  const order = (res && res.order) || TYPES;
  return ts.sort((a, b) => order.indexOf(a) - order.indexOf(b));
}
const mainColor = (res) => { const ts = typesOf(res); return ts.length ? COLOR[ts[0]] : null; };
function heroTitle(res) {
  const ts = typesOf(res);
  if (!ts.length) return `<span class="tl">${T('cham.full')}</span>`;
  return `<span class="tl">${ts.map((c) => `<span style="color:${COLOR[c]}">${T('title.one', { t: c, animal: ANIMAL[c], type: TNAME[c] })}</span>`).join(T('join.title'))}</span>`;
}
const heroH1 = (res) => `<h1${typesOf(res).length > 1 ? ' class="two-t"' : ''}>${heroTitle(res)}</h1>`;
// 組合型、對角型的類型代號接在上面那行後面，例如「：DI 組合型」
const heroCode = (res) => { const ts = typesOf(res); return ts.length > 1 ? T(res && res.kind === 'diag' ? 'code.diag' : 'code.blend', { ab: ts.join('') }) : ''; };
const ak = (t) => `<span class="ak ak-${t}">${ANIMAL[t]}</span>`;
const akList = (res) => { const ts = typesOf(res); return ts.length ? ts.map(ak).join(T('join.names')) : T('cham'); };
// 本色花色圓：ts 是類型陣列（例如 ['S','C']）；空陣列＝變色龍（四色鱗片）
const badge = (ts) => `<div class="badge">${(ts.length ? ts : [null]).map((t) => `<svg viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="url(#pat-${t || 'X'})"/></svg>`).join('')}</div>`;
const ghostBadge = () => '<div class="badge"><div class="ghost">?</div></div>';
const animalsOf = (ts) => ts.length ? ts.map((t) => ANIMAL[t]).join(T('join.names')) : T('cham');
// 主測驗（index.html）記下的「作答編號 → 本色」，例如 "SC"；找不到時回傳 null
function selfTypesOf(rid) {
  try { const m = JSON.parse(localStorage.getItem('disc-peer-self-v1')) || {}; return rid && typeof m[rid] === 'string' ? m[rid].split('') : null; } catch (e) { return null; }
}
// 對照結果頁：兩邊都知道了，各放自己的花色和類型（小字一律用墨色，動物色只用在圖形和大字）
function duoHTML(selfTs, peerTs) {
  return `<div class="peer-pair">
    <div class="f">${badge(selfTs)}<span class="lb">${T('pair.self')}</span><span class="ty">${animalsOf(selfTs)}</span></div>
    <span class="arrow" aria-hidden="true">⇄</span>
    <div class="f">${badge(peerTs)}<span class="lb">${T('pair.peer')}</span><span class="ty">${animalsOf(peerTs)}</span></div>
  </div>`;
}
function pairHTML(ts) {
  return `<div class="peer-pair" aria-hidden="true">
    <div class="f">${ts ? badge(ts) : '<div class="badge"><div class="ghost"></div></div>'}<span class="lb">${T('pair.self')}</span>${ts ? `<span class="ty">${animalsOf(ts)}</span>` : ''}</div>
    <span class="arrow">⇄</span>
    <div class="f">${ghostBadge()}<span class="lb">${T('pair.peer')}</span><span class="ty muted">${T('pair.wait')}</span></div>
  </div>`;
}

/* ---------- 深色模式開關（同 index.html：沒選過時跟著系統，切換後記住） ---------- */
const darkMQ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : !!(darkMQ && darkMQ.matches); };
/* 按鈕名稱顯示按下去會切到的模式（像語言按鈕一樣）；記在 data-i18n，換語言時也跟著對 */
const syncTheme = () => { const l = $('#bar-theme .lbl'); l.dataset.i18n = isDark() ? 'theme.light' : 'theme'; l.textContent = T(l.dataset.i18n); };
$('#bar-theme').addEventListener('click', () => {
  const t = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; try { localStorage.setItem('disc-theme', t); } catch (e) {}
  syncTheme();
});
if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', syncTheme);
syncTheme();

/* ---------- 語言切換（同主測驗：disc-lang 共用，?lang= 優先） ---------- */
const loadEN = () => window.PEER_LANG_EN ? Promise.resolve(window.PEER_LANG_EN) : new Promise((res, rej) => {
  const sc = document.createElement('script'), tm = setTimeout(() => rej(new Error('timeout')), 8000);
  sc.src = 'js/peer-lang-en.js';
  sc.onload = () => { clearTimeout(tm); window.PEER_LANG_EN ? res(window.PEER_LANG_EN) : rej(new Error('empty')); };
  sc.onerror = () => { clearTimeout(tm); rej(new Error('load')); };
  document.head.appendChild(sc);
});
function syncLangBtn() {
  const b = $('#bar-lang'); b.querySelector('.lang-k').textContent = T('bar.lang.short'); b.querySelector('.lbl').textContent = T('bar.lang');
}
async function setLang(code, { save = true } = {}) {
  let ok = true, pack = null;
  if (code === 'en') { try { pack = await loadEN(); } catch (e) { ok = false; code = 'zh'; } }
  X = PeerI18n.makeT(code, pack);
  useLang();
  if (save && ok) { try { localStorage.setItem('disc-lang', code); } catch (e) {} }
  // 網址上的 ?lang= 跟著改（重新整理、複製網址都維持同一語言）
  try { const u = new URL(location.href); if (u.searchParams.has('lang')) { u.searchParams.set('lang', code); history.replaceState(null, '', u); } } catch (e) {}
  applyStatic(); syncLangBtn();
  document.documentElement.classList.remove('lang-loading');
  $('#toast').textContent = '';
  if (quizActive && relang) relang(); else render();
  if (!ok) toast(PeerI18n.ZH.ui['lang.fail']);
}
$('#bar-lang').addEventListener('click', () => setLang(X.lang === 'en' ? 'zh' : 'en'));
if (X.lang === 'en') { const q = (new URLSearchParams(location.search).get('lang') || '').toLowerCase(); applyStatic(); syncLangBtn(); if (q === 'en') { try { localStorage.setItem('disc-lang', 'en'); } catch (e) {} } document.documentElement.classList.remove('lang-loading'); }
else { if ((new URLSearchParams(location.search).get('lang') || '').toLowerCase() === 'zh') { try { localStorage.setItem('disc-lang', 'zh'); } catch (e) {} } document.documentElement.classList.remove('lang-loading'); }

/* ---------- 作答中要離開時先確認（C2） ---------- */
let quizActive = false;
let relang = null;  // 作答中換語言時，重畫目前這一題用
document.querySelector('.bar-brand').addEventListener('click', (e) => {
  if (!quizActive) return;
  e.preventDefault();
  if (document.querySelector('.leave')) return;
  const box = document.createElement('div');
  box.className = 'leave'; box.setAttribute('role', 'alertdialog'); box.setAttribute('aria-label', T('lv.t'));
  box.innerHTML = `<p><b>${T('lv.t')}</b>${T('lv.b')}</p><div class="btns"><button class="btn primary" data-stay>${T('lv.stay')}</button><button class="btn" data-go>${T('lv.go')}</button></div>`;
  document.body.appendChild(box);
  box.querySelector('[data-stay]').focus();
  box.querySelector('[data-stay]').addEventListener('click', () => box.remove());
  box.querySelector('[data-go]').addEventListener('click', () => { quizActive = false; location.href = './'; });
});
const app = $('#app');
const view = (html, keepScroll = false) => { app.innerHTML = html; if (!keepScroll) window.scrollTo(0, 0); };
// 網址很快換來換去時，較早、還在等伺服器的畫面不能蓋掉新的：每次 render 拿一個編號，等完伺服器先確認自己還是最新的
let renderId = 0;
class Stale extends Error {}
const still = (my) => { if (my !== renderId) throw new Stale(); };
// 英文畫面產生的連結走 peer-en.html（英文的連結預覽），它會把人轉到 peer.html?lang=en，朋友打開就是英文
const pageUrl = (hash) => X.lang === 'en' ? new URL('peer-en.html', location.href).href.split(/[?#]/)[0] + hash : location.origin + location.pathname + hash;
const keyOf = (r) => (!r || !r.key || r.kind === 'none' || r.kind === 'chameleon') ? 'CH' : r.key;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 2200);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast(T('copied')); }
  catch (e) { toast(T('copyFail')); }
}
function message(title, body, actions = '') {
  view(`<div class="stack"><h2>${title}</h2><p class="muted">${body}</p>${actions}</div>`);
}
const failView = () => message(T('fail.t'), T('fail.b'), `<button class="btn primary" onclick="render()">${T('retry')}</button>`);

// 回到主測驗看自己的完整結果（首頁有「查看我的結果」；登入的人也可以從「我的歷次結果」打開）
const backLink = () => `<a class="back-link" href="./">${T('back.full')}</a>`;
// 逐一比較右邊的字：換算後（profile）和自己平均比的高低
const lvOf = (z) => T(z >= 1 ? 'lv.hi' : z >= 0.4 ? 'lv.mh' : z > -0.4 ? 'lv.mid' : z > -1 ? 'lv.ml' : 'lv.lo');

/* =====================================================================
   一、邀請頁（邀請人）
   ===================================================================== */
// from：從主測驗結果頁或「我的歷次結果」進來時，指定替哪一份作答產生邀請
async function renderInvite(my, from = null) {
  await P.init(); still(my);
  const own = P.loadOwner();
  if (own && own.code && own.ownerToken && (!from || !own.responseId || own.responseId === from)) return renderLinks(own);
  if (P.user) {
    const mine = await P.getMyInvites(); still(my);
    const hit = from ? mine.find((x) => x.response_id === from) : null;
    if (hit) { location.hash = '#k=' + hit.code; return; }
    if (!from && mine.length && !P.latestClaim()) { location.hash = '#k=' + mine[0].code; return; }
  }
  // 這個瀏覽器沒有這份（或任何一份）主測驗結果，也沒登入：同一個提示頁，可以去做測驗或登入帳號
  if (!P.user && (from ? !P.resultClaim(from).token : !P.latestClaim())) {
    view(`<div class="stack">
      <h2>${T('need.t')}</h2>
      <p class="muted">${T('need.b')}</p>
      <a class="btn primary block" href="./#agree">${T('need.start')}</a>
      <div class="card stack" style="gap:10px">
        <p style="font-weight:500">${T('need.other')}</p>
        <button class="btn block" id="go-login">${T('need.login')}</button>
      </div>
      <a class="btn block" href="./">${T('need.home')}</a>
    </div>`);
    return bindLogin();
  }
  view(`<div class="stack">
    <h1>${T('title')}</h1>
    <div class="stack" style="gap:6px">
      <p class="lead">${T('inv.lead')}</p>
      <p class="muted small">${T('inv.sub')}</p>
    </div>
    <div class="card stack" style="gap:8px">
      ${pairHTML(selfTypesOf(from || (P.latestClaim() || {}).id))}
      <p class="small muted" style="text-align:center">${T('inv.pairNote')}</p>
    </div>
    <form class="card stack" id="inv-form" novalidate style="gap:10px">
      <label class="f">${T('inv.nickQ')}

const ICON_SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function runQuiz(code, nick, relation, name, relationNote) {
  const seq = B.makeSeq(), picks = {}, times = {}, n = seq.length, sid = P.newSid();
  let idx = 0, shownAt = Date.now(), advanceTimer = null, locked = false;
  const langs = new Set([X.lang]);  // 作答期間用過的語言，送出時記到資料庫（切換過就是 mixed）
  const nm = esc(nick);

  quizActive = true;
  relang = () => { langs.add(X.lang); draw(); };  // 換語言：留在同一題、答案不動
  // 還差什麼才能往下：一個敘述不能同時是最像和最不像
  function hint(p, last) {
    if (!p.most && !p.least) return T('q.h0');
    if (!p.least) return T('q.h1');
    if (!p.most) return T('q.h2');
    return T(last ? 'q.h3last' : 'q.h3');
  }
  // focus：重畫後要把焦點放回去的按鈕 [敘述, most|least]；同一題重畫時不捲動
  function draw(focus = null) {
    const it = seq[idx], key = B.itemKey(it.i), p = picks[key] || {};
    const complete = p.most && p.least, last = idx === n - 1;
    view(`<div class="stack">
      <div class="top"><span>${T('q.progress', { i: idx + 1, n })}</span><span>${Math.round(idx / n * 100)}%</span></div>
      <div class="progress" aria-hidden="true"><i style="width:${idx / n * 100}%"></i></div>
      <p class="qt">${T('q.title', { nm })}</p>
      <div class="pick-head" aria-hidden="true"><span></span><span>${T('q.most')}</span><span>${T('q.least')}</span></div>
      <div class="words">${it.w.map((w) => `<div class="word${p.most === w ? ' is-most' : p.least === w ? ' is-least' : ''}">
        <span>${esc(wordOf(w))}</span>
        <button type="button" class="pick most" aria-pressed="${p.most === w}" data-w="${w}" data-k="most" aria-label="${esc(T('q.aMost', { w: wordOf(w) }))}"${locked ? ' disabled' : ''}>${ICON_CHECK}</button>
        <button type="button" class="pick least" aria-pressed="${p.least === w}" data-w="${w}" data-k="least" aria-label="${esc(T('q.aLeast', { w: wordOf(w) }))}"${locked ? ' disabled' : ''}>${ICON_X}</button>
      </div>`).join('')}</div>
      <p class="q-hint">${hint(p, last)}</p>
      <p class="err" id="q-err" hidden></p>
      <div class="btns">
        <button class="btn" id="q-prev" ${idx === 0 || locked ? 'disabled' : ''}>${T('q.prev')}</button>
        ${last ? `<button class="btn primary" id="q-send" ${complete ? '' : 'disabled'}>${T('q.send')}</button>`
               : `<button class="btn primary" id="q-next" ${complete ? '' : 'disabled'}>${T('q.next')}</button>`}
      </div>
    </div>`, !!focus);
    app.querySelectorAll('.pick').forEach((b) => b.addEventListener('click', () => choose(b.dataset.w, b.dataset.k)));
    if (focus) { const f = app.querySelector(`.pick[data-w="${focus[0]}"][data-k="${focus[1]}"]`); if (f) f.focus({ preventScroll: true }); }
    $('#q-prev').addEventListener('click', () => go(-1));
    const nx = $('#q-next'); if (nx) nx.addEventListener('click', () => go(1));
    const sd = $('#q-send'); if (sd) sd.addEventListener('click', send);
  }
  function choose(w, kind) {
    if (locked) return;
    const it = seq[idx], key = B.itemKey(it.i), p = picks[key] = picks[key] || {};
    const other = kind === 'most' ? 'least' : 'most';
    p[kind] = w;
    if (p[other] === w) delete p[other];
    if (p.most && p.least) times[key] = (times[key] || 0) + (Date.now() - shownAt), shownAt = Date.now();
    draw([w, kind]);
    clearTimeout(advanceTimer);
    if (p.most && p.least && idx < n - 1) advanceTimer = setTimeout(() => go(1), 350);
  }
  function go(d) {
    if (locked) return;
    clearTimeout(advanceTimer);
    idx = Math.max(0, Math.min(n - 1, idx + d));
    shownAt = Date.now();
    draw();
  }
  async function send() {
    // 送出後答案就固定：之後重送（同一個號碼牌）送的一定是同一份答案
    locked = true;
    app.querySelectorAll('.pick').forEach((b) => { b.disabled = true; });
    const btn = $('#q-send');
    btn.disabled = true; btn.textContent = T('q.sending');
    $('#q-prev').disabled = true;
    seq.forEach((it) => { const k = B.itemKey(it.i); times[k] = Math.min(600000, Math.round(times[k] || 0)); });
    const out = await P.submitRating({ sid, code, relation, relationNote, name, seq, picks, times, lang: langs.size > 1 ? 'mixed' : X.lang === 'en' ? 'en' : 'zh-TW' });
    if (out.ok) { quizActive = false; return renderRaterResult(nick, out, false); }
    const msg = T('q.e.' + (['closed', 'not_found', 'network'].includes(out.error) ? out.error : 'invalid'));
    const e = $('#q-err'); e.textContent = msg; e.hidden = false;
    if (out.error === 'network') { btn.disabled = false; btn.textContent = T('q.again'); }
    else btn.textContent = T('q.cant');
  }
  draw();
}

/* ---------- 朋友作答完的本色組成（同主測驗結果頁）：左邊本色花色圓＋「在你眼中」＋動物名稱，右邊四種動物的比例；本色的型旁邊放頭冠 ---------- */
const CROWN = c => `<svg class="crown" viewBox="0 0 28 24" aria-hidden="true">
    <path d="M4.2 17.2 2.8 7.9 9.2 12.4 14 4.2l4.8 8.2 6.4-4.5-1.4 9.3Z" fill="url(#crown-${c})" stroke="var(--crown-${c}-edge)" stroke-width="1" stroke-linejoin="round"/>
    <path d="M6.6 15.3h14.8" stroke="#fff" stroke-opacity=".55" stroke-width="1.1" stroke-linecap="round"/>
    <rect x="3.8" y="17" width="20.4" height="4.6" rx="1.6" fill="url(#crown-${c}-band)" stroke="var(--crown-${c}-edge)" stroke-width="1"/>
    <circle cx="9" cy="19.3" r=".95" fill="#fff" fill-opacity=".8"/><circle cx="14" cy="19.3" r="1.3" fill="var(--crown-${c}-gem)"/><circle cx="19" cy="19.3" r=".95" fill="#fff" fill-opacity=".8"/>
    <circle cx="2.8" cy="6.8" r="1.9" fill="url(#crown-${c})" stroke="var(--crown-${c}-edge)" stroke-width=".9"/><circle cx="14" cy="3.1" r="2.1" fill="url(#crown-${c})" stroke="var(--crown-${c}-edge)" stroke-width=".9"/><circle cx="25.2" cy="6.8" r="1.9" fill="url(#crown-${c})" stroke="var(--crown-${c}-edge)" stroke-width=".9"/>
  </svg>`;
// 比例：每題「最像」+1、「最不像」−1，換成 0–100 的明顯程度（50＋50×分數÷題數），四型加起來是 200，再換成加總 100 的比例（最大餘數法取整數）
function compPct(scores) {
  const raw = TYPES.map((t) => ({ t, v: (50 + 50 * scores[t] / B.ITEM_COUNT) / 2 })), out = {};
  raw.forEach((o) => { out[o.t] = Math.floor(o.v); });
  let left = 100 - raw.reduce((a, o) => a + Math.floor(o.v), 0);
  raw.slice().sort((a, b) => (b.v - Math.floor(b.v)) - (a.v - Math.floor(a.v))).forEach((o) => { if (left > 0) { out[o.t]++; left--; } });
  return out;
}
function compHTML(rec, nick) {
  const ts = typesOf(rec.result), pr = compPct(rec.scores), sc = rec.scores, nm = esc(nick);
  const ranked = ts.slice().sort((a, b) => sc[b] - sc[a]);
  const crownOf = (t) => !ts.includes(t) ? '' : CROWN(t === ranked[0] || sc[t] === sc[ranked[0]] ? 'gold' : 'silver');
  const circles = (ts.length ? ts : ['X']).map((t) => `<svg viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="url(#pat-${t})"/></svg>`).join('');
  const name = ts.length ? ts.map((t) => `<span>${t} ${ANIMAL[t]}</span>`).join(T('join.names')) : `<span>${T('cham')}</span>`;
  const top = ts.length === 1 ? T('rr.top1', { a: ak(ts[0]), nm })
    : ts.length === 2 ? T('rr.top2', { a: ak(ts[0]), b: ak(ts[1]), nm })
    : T('rr.top3', { nm });
  return `<div class="donut-side">
      <div class="donut" role="img" aria-label="${T('rr.aria', { nick: esc(nick), names: ts.length ? ts.map((t) => ANIMAL[t]).join(T('join.names')) : T('cham'), mix: TYPES.map((t) => ANIMAL[t] + ' ' + pr[t] + '%').join(T('rr.sep')) })}"><div class="cs">${circles}</div><span class="lb">${T('rr.inEyes')}</span><span class="ty">${name}</span></div>
      <ul class="donut-legend" aria-hidden="true">${TYPES.map((t) => `<li>${swatchSm(t)}${t} ${ANIMAL[t]}${crownOf(t)}<b>${pr[t]}%</b></li>`).join('')}</ul>
      <ul class="notes"><li>${T('rr.n1')}</li><li>${top}</li></ul>
    </div>`;
}
const swatchSm = (t) => `<svg class="pat" viewBox="0 0 18 18"><rect width="18" height="18" fill="url(#pat-${t})"/></svg>`;

// 作答完的畫面：頁尾的「測出自己的動物本色」卡片（也用在找不到邀請的畫面）。中間放主測驗首頁的四種動物小卡
const ctaHTML = () => `<div class="card stack" id="cta-card" style="gap:10px;background:var(--selected);border:none">
      <h2 style="font-size:20px">${T('cta.t')}</h2>
      <p class="small">${T('cta.b1')}</p>
      ${typesHTML()}
      <p class="small">${T('cta.b2')}</p>
      <p class="small muted">${T('cta.meta', { n: PeerI18n.MAIN_ITEM_COUNT })}</p>
      <a class="btn primary block" href="./">${T('cta.btn')}</a>
    </div>`;
// 底部固定按鈕列（同主測驗結果頁的「儲存／分享結果圖片」）：一直顯示「測出自己的動物本色」；頁尾那張卡片出現在畫面上時先藏起來，同一件事不同時出現兩個按鈕
function setupCtaDock() {
  const dock = $('#cta-dock'), card = $('#cta-card');
  if (!dock || !card) return;
  if (window.IntersectionObserver) {
    const io = new IntersectionObserver((es) => es.forEach((e) => dock.classList.toggle('away', e.isIntersecting)), { threshold: 0.25 });
    io.observe(card);
  }
}
function renderRaterResult(nick, rec, again) {
  const key = keyOf(rec.result), t = R.TEXT[key], nm = esc(nick);
  const main = mainColor(rec.result);

    ${again ? `<p class="muted small">${T('rr.again', { nm })}</p>`
            : `<div class="sent" role="status"><span class="ok" aria-hidden="true">✓</span>${T('rr.sent', { nm })}</div>`}
    <div class="hero">

      ${heroH1(rec.result)}

      <h3 style="font-size:18px">${T('rr.mix')}</h3>
      ${compHTML(rec, nick)}
    </div>
    <div class="fold-card" id="fold">
      <p class="fold-h">${R.fill(T('rr.full'), nick)}</p>
      <div class="fold-peek" aria-hidden="true"><ul>${peek.map((x) => `<li>${x}</li>`).join('')}</ul></div>
      <button type="button" class="fold-btn" aria-expanded="false" aria-controls="fold-body">${T('rr.seeFull')}${ICON_DOWN}</button>
      <div class="fold-body" id="fold-body" hidden>
        ${secs.map((x) => `<div class="card sec"><h3>${x.title}</h3><ul>${x.items.map((y) => `<li>${y}</li>`).join('')}</ul>${x.tip ? `<div class="tip"><b>${x.tip[0]}</b>${x.tip[1]}</div>` : ''}</div>`).join('')}
      </div>
    </div>
    <p class="note">${T('rr.ref')}</p>
    ${ctaHTML()}
  </div>
  <div class="cta-dock" id="cta-dock"><a class="btn primary" href="./">${T('cta.btn')}</a></div>`);
  setupCtaDock();
  const fold = $('#fold'), fb = fold.querySelector('.fold-btn');
  fb.addEventListener('click', () => {
    const open = fb.getAttribute('aria-expanded') !== 'true';
    fb.setAttribute('aria-expanded', String(open));
    fb.firstChild.textContent = open ? T('rr.hide') : T('rr.seeFull');
    fold.classList.toggle('open', open);
    $('#fold-body').hidden = !open;
  });
}

async function renderOwner(code, token, my) {
  await P.init(); still(my);
  const own = P.loadOwner();
  if (!token && own && own.code === code) token = own.ownerToken;
  const res = await P.getResults(code, token); still(my);
  if (!res) {
    if (own && own.code === code) P.saveOwner(null);
    return message(T('ow.bad.t'), T('ow.bad.b'),
      `${P.user ? '' : `<button class="btn primary block" id="go-login">${T('need.login')}</button>`}<a class="btn block" href="#">${T('ow.bad.back')}</a>`) || bindLogin();
  }
  if (token && !P.user && (!own || own.code !== code || own.ownerToken !== token)) P.saveOwner({ code, ownerToken: token, nickname: res.nickname });
  let group = '全部';
  // keep：重畫時不捲回最上面（切換頁尾的開關時用）
  const draw = (keep = false) => {
    const g = res.groups.find((x) => x.relation === group) || res.groups[0];
    const total = res.groups[0].n, few = total > 0 && total < 3;  // 少於 3 人時提醒再邀請幾位
    const inviteUrl = pageUrl('#r=' + code);
    let body;
    if (!total) {
      // 還沒有人回覆：先放自己的花色和打問號的「大家眼中」，提醒自己的結果是什麼
      body = `<div class="card stack" style="gap:10px;text-align:center" id="empty-box">
        ${pairHTML(typesOf(res.self_result))}
        <p style="font-weight:700">${T('ow.empty.t')}</p>
        <p class="small muted">${T('ow.empty.b')}</p>
        ${shareBtnsHTML(res.nickname || '', inviteUrl, { line: false, copyLabel: T('lk.copy') })}
      </div>
      ${backLink()}`;
    } else {
      // 兩邊各自換算成「形狀」再比（見 peer-bank.js profile）：自評和他評的尺度不同，直接比他評會顯得比較極端
      const selfN = B.profile(B.normSelf(res.self_mean)), peerN = B.profile(B.normPeer(g.scores));
      const selfKey = keyOf(res.self_result), peerRes = B.classify(g.scores), peerKey = peerRes.key;
      // 圖的兩端固定是 ±1.8（換算後的最大可能值約 ±1.73）
      const pos = (x) => (50 + (Math.max(-1.8, Math.min(1.8, x)) / 1.8) * 45).toFixed(1);
      const rows = TYPES.map((t) => {
        const a = pos(selfN[t]), b = pos(peerN[t]), lo = Math.min(a, b), w = Math.abs(a - b);
        return `<div class="db-row"><span><span class="dotc" style="background:${COLOR[t]}"></span>${ANIMAL[t]}</span>
          <div class="db-track"><div class="axis"></div><div class="mid"></div><div class="seg" style="left:${lo}%;width:${w}%"></div>
          <div class="pt peer" style="left:${b}%"></div><div class="pt self" style="left:${a}%"></div></div>
          <span class="v s">${lvOf(selfN[t])}</span><span class="v">${lvOf(peerN[t])}</span></div>`;
      }).join('');
      const lines = B.gapLines(selfN, peerN);
      // 落差說明：每一型一張卡片，開頭標動物和「你可能沒注意到的一面／大家比較少看見的一面」
      const gapCard = (x) => { const g2 = R.GAP[x.dir === 'peer' ? 'up' : 'down'];
        return `<div class="gap" style="--gc:${COLOR[x.t]}"><p class="gh">${ak(x.t)}${g2.title}</p><p>${g2[x.t][0]}</p><p class="ask">${T('ow.ask', { q: g2[x.t][1] })}</p></div>`; };
      const gapHTML = lines.length ? lines.map(gapCard).join('') : `<div class="gap"><p>${R.GAP.same}</p></div>`;
      // 每個人眼中的你：留名字的人（名字＋關係＋類型），接著是匿名的人（只寫「匿名」和類型，不顯示關係）。
      // 後端升級 v12 之前沒有 anon 清單，匿名的人只顯示人數
      const anonList = Array.isArray(res.anon) ? res.anon : null;
      const rowsNamed = res.named.map((x) => `<div class="row"><span>${esc(x.name)}<span class="tag">${esc(x.relation === '其他' && x.relation_note ? x.relation_note : X.rel(x.relation))}</span></span><span>${akList(x.result)}</span></div>`).join('');
      const rowsAnon = anonList ? anonList.map((x) => `<div class="row"><span class="muted">${T('ow.anon')}</span><span>${akList(x.result)}</span></div>`).join('') : '';
      const anonNote = anonList ? '' : res.n_anon ? `<p class="small muted">${T('ow.anonMore', { n: res.n_anon })}</p>` : '';
      const named = rowsNamed || rowsAnon ? `<div class="card named">
          <p style="font-weight:700">${T('ow.eachT')}</p>
          ${rowsNamed}${rowsAnon}${anonNote}
        </div>` : `<p class="small muted">${T('ow.anonAll', { n: res.n_anon })}</p>`;
      // 最上面的結論：大家眼中的類型＋一句和自評的對照（用落差最大的那一型）
      const up = lines.find((x) => x.dir === 'peer'), down = lines.find((x) => x.dir === 'self');
      const selfA = animalsOf(typesOf(res.self_result));
      const sentence = up ? T('ow.s.up', { a: selfA, f: featureOf(up.t) })
        : down ? T('ow.s.down', { a: selfA, f: featureOf(down.t) })
        : T('ow.s.same', { a: selfA });
      const who = group === '全部' ? T('ow.who.all', { n: g.n }) : T('ow.who.rel', { n: g.n, rel: esc(g.n === 1 ? X.relLo(group) : X.relPl(group)) });
      body = `<div class="chips" role="group" aria-label="${T('ow.filter')}">${res.groups.map((x) => `<button type="button" class="chip" aria-pressed="${x.relation === group}" data-g="${x.relation}">${esc(x.relation === '全部' ? T('ow.all') : X.rel(x.relation))}<span class="n">${x.n}</span></button>`).join('')}</div>
        ${few ? `<div class="warn stack" style="gap:10px" id="few-box"><p>${T('ow.few', { n: total })}</p>${shareBtnsHTML(res.nickname || '', inviteUrl, { copy: false, line: false })}</div>` : ''}
        <div class="hero" style="--main:${mainColor(peerRes) || 'var(--ink)'}">
          <p class="eyebrow">${T('ow.eyebrow', { who, code: heroCode(peerRes) })}</p>
          ${heroH1(peerRes)}
          <p class="one">${sentence}</p>
        </div>
        <div class="card stack" style="gap:8px">${duoHTML(typesOf(res.self_result), typesOf(peerRes))}${backLink()}</div>
        <div class="gaps">${gapHTML}</div>
        ${few ? '' : `<div class="card stack" style="gap:10px" id="more-box">
          <div class="stat"><span style="font-weight:700">${T('ow.more.n', { n: total })}</span><b>${total}</b></div>
          <p class="small muted">${T('ow.more.b')}</p>
          ${shareBtnsHTML(res.nickname || '', inviteUrl, { copy: false })}
        </div>`}
        <div class="card db">
          <p style="font-weight:700">${T('ow.cmpT')}</p>
          <div class="legend"><span><span class="dotc self"></span>${T('ow.legSelf')}</span><span><span class="dotc peer"></span>${T('ow.legPeer', { n: g.n })}</span></div>
          <div class="db-head" aria-hidden="true"><span></span><span></span><span>${T('ow.you')}</span><span>${T('ow.others')}</span></div>
          ${rows}
          <div class="db-scale"><span></span><div><span>${T('ow.less')}</span><span>${T('ow.avg')}</span><span>${T('ow.moreS')}</span></div><span></span><span></span></div>
          <p class="note">${T('ow.cmpNote')}</p>
        </div>
        ${named}
        <p class="note">${T('ow.ref')}</p>`;
    }
    view(`<div class="stack">
      <h1 style="font-size:24px">${T('title')}</h1>
      ${body}
      <div class="settings">
        <div class="switch"><span id="sw-l">${T('ow.swL')}</span><button type="button" role="switch" aria-labelledby="sw-l" aria-describedby="sw-d" aria-checked="${res.is_open}" id="sw"></button></div>
        <p class="note" id="sw-d">${T('ow.swD')}</p>
      </div>
    </div>`, keep);
    app.querySelectorAll('[data-g]').forEach((b) => b.addEventListener('click', () => { group = b.dataset.g; draw(); }));
    ['#more-box', '#few-box', '#empty-box'].forEach((q) => { const el = $(q); if (el) bindShare(el, res.nickname || '', inviteUrl); });
    $('#sw').addEventListener('click', async (e) => {
      const want = !res.is_open, b = e.currentTarget;
      b.disabled = true;
      try {
        if (!(await P.setOpen(code, token, want))) throw new Error('rejected');
        res.is_open = want;
        toast(T(want ? 'ow.swOn' : 'ow.swOff'));
      } catch (err) { toast(T('ow.swFail')); }
      draw(true);
      $('#sw').focus({ preventScroll: true });
    });
  };
  draw();
}

/* ---------- 路由 ---------- */
async function render() {
  if (!P.enabled) return message(T('nobackend.t'), T('nobackend.b'));
  const h = P.parseHash(location.hash);
  const my = ++renderId;
  try {
    if (h.mode === 'rate') await renderRate(h.code, my);
    else if (h.mode === 'owner') await renderOwner(h.code, h.token, my);
    else await renderInvite(my, h.from || null);
  } catch (e) { if (!(e instanceof Stale) && my === renderId) failView(); }
}
window.addEventListener('hashchange', render);
render();
</script>
